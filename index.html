async function loadAudio(id){
  const url = await call('녹음을 불러오는 중이에요', 'getAudio', id);
  document.getElementById('audioBox').innerHTML = `<audio id="aud" controls src="${url}"></audio>
    <div class="seg" style="margin:.4rem 0 0"><button class="sel" id="r1" onclick="rate(1)">보통 속도</button><button id="r08" onclick="rate(0.8)">천천히</button></div>`;
  document.getElementById('aud').play();
}
function rate(v){
  document.getElementById('aud').playbackRate = v;
  document.getElementById('r1').classList.toggle('sel', v === 1);
  document.getElementById('r08').classList.toggle('sel', v !== 1);
}
function speakSummary(){
  const s = S.detail.summary || {}, care = toList(s['조심할것']), em = toList(s['응급신호']);
  speak([s['한줄요약'] || '', '무슨 병인가요. ' + (s['무슨병']||''), '약은 이렇게 드세요. ' + (s['약']||''),
         care.length ? '조심할 것. ' + care.join('. ') + '.' : '',
         em.length ? '이럴 땐 바로 병원에 가세요. ' + em.join('. ') + '.' : '',
         S.detail.next ? '다음 진료는 ' + korDate(S.detail.next) + ' ' + korTime(S.detail.next.slice(11)) + '입니다.' : ''].join(' '));
}
/* ===== PDF 저장 · 다른 앱으로 공유(카카오톡·문자·인스타그램 DM 등) ===== */
const ICON = {
  trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5"/></svg>',
  share: '<svg class="ico" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',
  pdf:   '<svg class="ico" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 12v6M9.5 15.5L12 18l2.5-2.5"/></svg>',
  speak: '<svg class="ico" viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>'
};
function b64ToBlob(b64, type){ return new Blob([Uint8Array.from(atob(b64), c => c.charCodeAt(0))], {type}); }
async function makePdfFor(id, msg){
  const p = await call(msg, 'makePdf', id);
  S.pdf = {id, name: p.name, url: p.url, blob: b64ToBlob(p.base64, 'application/pdf')};
  return S.pdf;
}
function downloadPdf(){
  if (!S.pdf) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(S.pdf.blob); a.download = S.pdf.name;
  document.body.appendChild(a); a.click(); a.remove();
}
async function savePdf(id){
  await makePdfFor(id, 'PDF를 만드는 중이에요');
  downloadPdf(); drawPdfLink();
  toast('PDF를 저장했어요');
}
/** PDF를 만든 뒤: 드라이브에서 열기 + 공유 안내 (공유하기 버튼은 'PDF 저장' 바로 옆에 있어요) */
function drawPdfLink(){
  const el = document.getElementById('pdfLink');
  if (!el || !S.pdf || !S.detail || S.pdf.id !== S.detail.id) return;
  el.innerHTML = `<a class="btn outline" style="text-decoration:none;display:flex;align-items:center;justify-content:center;min-height:48px;margin-bottom:.4rem" href="${S.pdf.url}" target="_blank">저장한 PDF 열기 (구글 드라이브)</a>
    <div class="small" style="margin-bottom:.6rem">"공유하기"를 누르면 카카오톡·문자·인스타그램 DM 등 다른 앱으로 PDF를 바로 보낼 수 있어요</div>`;
}
/** 휴대폰의 '공유' 창을 열어 PDF를 다른 앱으로 보내요. 공유 창이 없는 컴퓨터에서는 요약 글을 복사하고 PDF를 내려받아요. */
async function sharePdf(id){
  if (!S.pdf || S.pdf.id !== id){ await makePdfFor(id, '공유할 PDF를 만드는 중이에요'); drawPdfLink(); }
  const file = new File([S.pdf.blob], S.pdf.name, {type: 'application/pdf'});
  if (!IN_GAS && navigator.share){
    try {
      if (navigator.canShare && navigator.canShare({files: [file]})) await navigator.share({files: [file], title: S.pdf.name});
      else await navigator.share({title: S.pdf.name, text: summaryTextClient()});
      return;
    } catch(e){
      if (e && e.name === 'AbortError') return;   // 공유 창을 그냥 닫음
      if (e && e.name === 'NotAllowedError'){ toast('공유할 준비가 됐어요. "공유하기"를 한 번 더 눌러 주세요'); return; }
    }
  }
  let copied = false;
  try { await navigator.clipboard.writeText(summaryTextClient()); copied = true; } catch(e){}
  downloadPdf();
  toast((copied ? '요약 글을 복사하고 ' : '') + 'PDF를 내려받았어요. 카카오톡 PC 대화창에 붙여 넣거나 파일을 끌어다 놓으세요');
}
/** 공유용 요약 글 (서버 PDF 내용과 같아요) */
function summaryTextClient(){
  const r = S.detail || {}, s = r.summary || {};
  const L = ['들었닥 진료 요약', korDate(r.date || ymd(new Date()), true) + ' ' + (r.hospital || '') + ' ' + (r.dept || ''), '',
    ...(s['한줄요약'] ? ['▶ ' + s['한줄요약'], ''] : []),
    '■ 무슨 병인가요?', s['무슨병'] || '-', '', '■ 약은 어떻게 먹나요?', s['약'] || '-', '',
    '■ 조심할 것', ...(toList(s['조심할것']).map(t => '☐ ' + t)), '',
    ...(toList(s['응급신호']).length ? ['■ 이럴 땐 바로 병원(응급실)에 가세요', ...toList(s['응급신호']).map(t => '· ' + t), ''] : []),
    '■ 다음 진료', r.next ? korDate(r.next, true) + ' ' + korTime(r.next.slice(11)) : '-', ''];
  const terms = (s['용어풀이'] || []).filter(t => t['용어']);
  if (terms.length){ L.push('■ 어려운 말 풀이'); terms.forEach(t => L.push('· ' + t['용어'] + ': ' + t['설명'])); L.push(''); }
  if ((s['할일'] || []).length){ L.push('■ 매일 할 일'); s['할일'].forEach(t => L.push('· [' + t['시간대'] + '] ' + t['할일'])); L.push(''); }
  const ask = toList(s['확인필요']);
  if (ask.length){ L.push('■ 선생님께 다시 여쭤볼 것'); ask.forEach(t => L.push('· ' + t)); L.push(''); }
  L.push('※ AI 요약은 참고용이에요. 궁금한 점은 의료진·약사에게 확인하세요.');
  return L.join('\n');
}
async function share(id){

/* ================= 3-1 건강관리 ================= */
/** 서버에서 받은 날짜 목록을 항상 날짜순으로 정렬 */
function days(cal){ return (cal.days || []).slice().sort((a, b) => a.date < b.date ? -1 : 1); }
function weekStart(d){ const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function calCell(dateStr, info, today, onclick){
  const d = parse(dateStr).getDate();
  let cls = '';
  if (info && info.rate != null) cls = info.rate === 100 ? 'full' : info.rate >= 50 ? 'half' : 'low';
  if (dateStr === today) cls += ' today';
  if (dateStr > today) cls += ' future';
  const dots = (info && info.event ? '<span class="dot" style="background:var(--red)"></span>' : '') + (info && info.visit ? '<span class="dot" style="background:var(--blue)"></span>' : '');
  return `<button class="${cls}" data-d="${dateStr}" onclick="${onclick}('${dateStr}')">${dateStr === today ? '오늘' : d}<span class="dots">${dots}</span></button>`;
}
/** 넓은 화면(1100px 이상)이면 세 칸 건강관리. 창 크기가 바뀌면 알맞게 다시 그려요. */

/* ----- 할 일 타임라인: 아침 · 낮 · 저녁 · 자기 전 ----- */
const SLOT_UI = {
  '아침':  {cls:'s1', label:'아침',  icon:'<path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 5v3M5.6 10.6l1.5 1.5M18.4 10.6l-1.5 1.5"/>'},
  '낮':    {cls:'s2', label:'낮',    icon:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'},
  '저녁':  {cls:'s3', label:'저녁',  icon:'<path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 4v5M9.5 6.5L12 9l2.5-2.5"/>'},
  '자기전':{cls:'s4', label:'자기 전',icon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'}
};
function srcLabel(t){
  if (!t.rec || t.rec === '직접추가') return '직접 추가한 할 일';
  return (t.recDate ? korDate(t.recDate) + ' ' : '') + (t.recDept ? t.recDept + ' ' : '') + '진료';
}
/** 꾹 누르기 메뉴에 필요한 정보를 할 일 버튼에 붙여요 */
function taskData(t){ return `data-tid="${esc(t.id)}" data-done="${t.done ? 1 : 0}" data-rec="${esc(t.rec || '직접추가')}" data-src="${esc(srcLabel(t))}" data-text="${esc(t.text)}"`; }
/** opt.interactive: 눌러서 체크·빼기 가능(오늘), opt.past: 지난 날(안 먹은 약 ✕ 표시) */
function taskTimeline(tasks, opt){
  opt = opt || {};
  return `<div class="tl">` + Object.keys(SLOT_UI).map(sl => {
    const ts = tasks.filter(t => t.time === sl); if (!ts.length) return '';
    const u = SLOT_UI[sl], d = ts.filter(t => t.done).length, at = S.settings && S.settings['알림시간_' + sl];
    return `<section class="tl-slot ${u.cls}">
      <div class="tl-head"><span class="tl-dot"><svg viewBox="0 0 24 24">${u.icon}</svg></span><b>${u.label}</b>${at ? `<span class="tl-time">${korTime(at)}</span>` : ''}
        <span class="tl-cnt ${d === ts.length ? 'all' : ''}">${d === ts.length ? '✓ 다 했어요' : d + ' / ' + ts.length}</span></div>
      <div class="tl-items">${ts.map(t => {
        const miss = opt.past && !t.done && t.kind === '약';
        return `<div class="tl-row"><button class="ck ${t.done ? 'done' : miss ? 'miss' : ''}" data-tid="${esc(t.id)}" data-done="${t.done ? 1 : 0}" data-rec="${esc(t.rec || '직접추가')}" data-src="${esc(srcLabel(t))}" data-text="${esc(t.text)}">
          <span class="bx">${t.done ? '✓' : miss ? '✕' : ''}</span><span class="tx">${esc(t.text)}</span><span class="tag">${esc(t.kind)}</span></button>
        </div>`;
      }).join('')}</div></section>`;
  }).join('') + `</div>`;
}
/** 할 일 누르기(체크) / 꾹 누르기·오른쪽 클릭(지우기 메뉴) */
/** 할 일 누르기(체크) / 꾹 누르기
    - 기본(컴퓨터 건강관리): 0.6초 꾹 누르거나 오른쪽 클릭 → 지우기 메뉴
    - reveal(휴대폰 건강관리): 2초 꾹 누르면 그 줄 옆에 '빼기' 버튼이 나와요. 누르는 동안 아래에 막대가 차올라요.
      손가락이 조금이라도 움직이면(화면 넘기기) 취소돼서 잘못 눌릴 일이 적어요. */
function bindTasks(root, interactive, reveal){
  if (!root) return;
  const HOLD = reveal ? 2000 : 600;
  root.querySelectorAll('.ck[data-tid]').forEach(el => {
    let timer = null, barT = null, fired = false, x0 = 0, y0 = 0;
    const stop = () => { clearTimeout(timer); clearTimeout(barT); el.classList.remove('pressing'); };
    const open = () => {
      stop(); fired = true;
      try { if (navigator.vibrate) navigator.vibrate(30); } catch(e){}
      if (reveal) showRm(el.closest('.pslot-row')); else taskMenu(el.dataset);
    };
    el.addEventListener('pointerdown', e => {
      fired = false; x0 = e.clientX; y0 = e.clientY; stop();
      timer = setTimeout(open, HOLD);
      if (reveal) barT = setTimeout(() => el.classList.add('pressing'), HOLD - 1600);   // 0.4초 뒤부터 막대 표시
    });
    el.addEventListener('pointermove', e => { if (Math.abs(e.clientX - x0) + Math.abs(e.clientY - y0) > 10) stop(); });
    ['pointerup','pointerleave','pointercancel'].forEach(n => el.addEventListener(n, stop));
    el.addEventListener('contextmenu', e => {
      e.preventDefault();
      if (reveal) return;              // 휴대폰은 2초 꾹 누르기로만(안드로이드가 0.5초쯤 보내는 메뉴 신호는 무시)
      stop(); if (!fired) open();
    });
    el.addEventListener('click', () => {
      if (fired){ fired = false; return; }
      const row = el.closest('.pslot-row');
      if (row && row.classList.contains('show-rm')){ hideRm(); return; }   // 빼기 버튼이 보일 때 누르면 닫기만(실수로 체크되지 않게)
      if (interactive) tick(el.dataset.tid, el.dataset.done !== '1');
    });
  });
}
/** 빼기 버튼을 그 줄에만 보여주고, 6초 지나거나 다른 곳을 누르면 다시 숨겨요 */
let rmT = null;
function showRm(row){
  if (!row) return;
  hideRm(); row.classList.add('show-rm');
  rmT = setTimeout(hideRm, 6000);
  setTimeout(() => document.addEventListener('pointerdown', outsideRm, true), 0);
}
function hideRm(){
  clearTimeout(rmT);
  document.querySelectorAll('.pslot-row.show-rm').forEach(r => r.classList.remove('show-rm'));
  document.removeEventListener('pointerdown', outsideRm, true);
}
function outsideRm(e){ if (!e.target.closest('.pslot-row.show-rm')) hideRm(); }
function manageLink(n, phone){
  return n ? `<button class="linkbtn" onclick="manageTasks()">할 일 정리하기</button><div class="lphint">${phone
    ? '할 일을 2초 동안 꾹 누르면 "빼기" 버튼이 나와요. 진료별로 한꺼번에 지우려면 위를 눌러요'
    : '할 일을 꾹 누르면(컴퓨터는 마우스 오른쪽) 빼거나, 진료별로 한꺼번에 지울 수 있어요'}</div>` : '';
}

/* ----- 아래에서 올라오는 메뉴 ----- */
function openSheet(html){

}
function closeSheet(){ const s = document.getElementById('sheet'); if (s) s.classList.add('hidden'); }

/** 할 일을 꾹 눌렀을 때: 이 할 일만 빼기 / 같은 진료에서 나온 할 일 모두 지우기 */
function taskMenu(ds){
  const rec = ds.rec || '직접추가';
  const same = (S.tlTasks || []).filter(t => (t.rec || '직접추가') === rec).length;
  S.groups = S.groups || {}; S.groups[rec] = {label: ds.src, count: same};
  openSheet(`<b class="sh-t">${esc(ds.text)}</b>
    <div class="small" style="margin:.2rem 0 .8rem">${rec === '직접추가' ? '직접 추가한 할 일이에요' : esc(ds.src) + '에서 나온 할 일이에요'}</div>
    <button class="btn" onclick="closeSheet();removeTask('${esc(ds.tid)}')">이 할 일만 빼기</button>
    <button class="btn danger" style="margin-top:.5rem" onclick="bulkRemove('${esc(rec)}')">${esc(ds.src)} 할 일 ${same}개 모두 지우기</button>
    <button class="btn" style="margin-top:.5rem" onclick="closeSheet()">닫기</button>`);
}
/** '할 일 정리하기': 진료 기록별 묶음 목록 */
function groupLabel(g){ return g.rec === '직접추가' ? '직접 추가한 할 일' : (g.date ? korDate(g.date) + ' ' : '') + (g.dept ? g.dept + ' ' : '') + '진료'; }
async function manageTasks(){
  const gs = await call('불러오는 중이에요', 'getTaskGroups');
  S.groups = {}; gs.forEach(g => S.groups[g.rec] = {label: groupLabel(g), count: g.count});
  openSheet(`<b class="sh-t">할 일 정리하기</b>
    <div class="small" style="margin:.2rem 0 .5rem">진료 기록별로 할 일을 한꺼번에 지울 수 있어요. 이미 체크한 지난 기록은 그대로 남아요.</div>
    ${gs.length ? gs.map(g => `<div class="grp"><div><b>${esc(groupLabel(g))}</b>
        <div class="small">${esc(g.items.slice(0, 3).join(', '))}${g.items.length > 3 ? ' 외 ' + (g.items.length - 3) + '개' : ''}</div></div>
        <button class="rm danger" onclick="bulkRemove('${esc(g.rec)}')">${g.count}개 지우기</button></div>`).join('')
      : '<div class="sub">지금 하고 있는 할 일이 없어요</div>'}
    <button class="btn" style="margin-top:.8rem" onclick="closeSheet()">닫기</button>`);
}
async function bulkRemove(rec){
  const g = (S.groups || {})[rec] || {label:'이 진료', count:''};
  const q = rec === '직접추가' ? `직접 추가한 할 일 ${g.count}개를 모두 지울까요?` : `${g.label}에서 나온 할 일 ${g.count}개를 모두 지울까요?`;
  if (!confirm(q + '\n이미 체크한 지난 기록은 그대로 남아요.')) return;
  closeSheet();
  const n = await call('지우는 중이에요', 'removeTasksByRecord', rec);
  toast('할 일 ' + n + '개를 지웠어요'); refreshTasksView();
}

async function removeTask(id){

async function saveTask(){

/** 휴대폰 할 일: 아침·낮·저녁·자기 전을 각각 색깔 테두리 상자로(아침 주황 · 낮 청록 · 저녁 다홍 · 자기 전 남색)
    opt.readonly: 보기만(지난 날 기록), opt.past: 지난 날이면 안 먹은 약에 ✕ */
function phoneSlotsHTML(tasks, opt){
  opt = opt || {};
  return Object.keys(SLOT_UI).map(sl => {
    const ts = tasks.filter(t => t.time === sl); if (!ts.length) return '';
    const u = SLOT_UI[sl], d = ts.filter(t => t.done).length, at = S.settings && S.settings['알림시간_' + sl];
    return `<section class="pslot ${u.cls}">
      <div class="pslot-h"><span class="tl-dot"><svg viewBox="0 0 24 24">${u.icon}</svg></span><b>${u.label}</b>${at ? `<span class="tl-time">${korTime(at)}</span>` : ''}
        <span class="tl-cnt ${d === ts.length ? 'all' : ''}">${d === ts.length ? '✓ 다 했어요' : d + ' / ' + ts.length}</span></div>
      ${ts.map(t => {
        const miss = opt.past && !t.done && t.kind === '약', cls = t.done ? 'done' : miss ? 'miss' : '', mark = t.done ? '✓' : miss ? '✕' : '';
        if (opt.readonly) return `<div class="pslot-row"><div class="ck ${cls}"><span class="bx">${mark}</span><span class="tx">${esc(t.text)}</span><span class="tag">${esc(t.kind)}</span></div></div>`;
        return `<div class="pslot-row"><button class="ck ${cls}" ${taskData(t)}><span class="bx">${mark}</span><span class="tx">${esc(t.text)}</span><span class="tag">${esc(t.kind)}</span></button>
          <button class="rm" onclick="removeTask('${esc(t.id)}')" aria-label="할 일 빼기">빼기</button></div>`;
      }).join('')}
    </section>`;
  }).join('');
}

/* ----- 글자 크기 끌기 막대 (컴퓨터) : 끄는 동안 모든 글자가 바로 바뀌고, 놓으면 저장 ----- */
const FS_MIN = 16, FS_MAX = 30;
function fontSliderHTML(){
  const cur = parseInt(fontPx(), 10);
  const marks = [['작게',16],['보통',19],['크게',22],['아주 크게',26],['최대',30]];
  const pos = v => `calc(15px + (100% - 30px) * ${(v - FS_MIN) / (FS_MAX - FS_MIN)})`;
  return `<div class="fs-box">
    <div class="fs-prev">가나다라 · 글자 크기 미리보기</div>
    <div class="fs-row"><span aria-hidden="true" style="font-size:16px;font-weight:700">가</span>
      <div class="fs-track">
        <input type="range" id="fsRange" min="${FS_MIN}" max="${FS_MAX}" step="1" value="${cur}" aria-label="글자 크기" oninput="previewFont(this.value)" onchange="commitFont(this.value)">
        <div class="fs-ticks">${marks.map(([l, v]) => `<button style="left:${pos(v)}" onclick="commitFont(${v})">${l}</button>`).join('')}</div>
      </div>
      <span aria-hidden="true" style="font-size:30px;font-weight:700">가</span></div>
    <div class="small" style="text-align:center">지금 <b id="fsVal">${cur}</b> · 막대 위 동그라미를 좌우로 끌어 보세요</div></div>`;
}
function previewFont(v){ applyFont(v + 'px'); const b = document.getElementById('fsVal'); if (b) b.textContent = v; }
let fontSaveT;
function commitFont(v){
  v = Math.min(FS_MAX, Math.max(FS_MIN, parseInt(v, 10)));
  S.settings['글자크기'] = v + 'px'; previewFont(v);
  const r = document.getElementById('fsRange'); if (r) r.value = v;
  clearTimeout(fontSaveT);
  fontSaveT = setTimeout(async () => {
    try { await run('saveSetting', '글자크기', v + 'px'); toast('글자 크기를 바꿨어요'); } catch(e){ toast('저장하지 못했어요. 다시 해 주세요'); }
  }, 400);
}

function birthLine(b){
  const m = String(b || '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (!m) return b ? esc(b) : '';
  const now = new Date(), y = +m[1], mo = +m[2], d = +m[3];
  let age = now.getFullYear() - y; if (now.getMonth() + 1 < mo || (now.getMonth() + 1 === mo && now.getDate() < d)) age--;
  return `${y}년 ${mo}월 ${d}일생 (만 ${age}세)`;
}
function medHTML(m){
  const rx = m.kind !== '지속';
  const tag = !rx ? '꾸준히' : m.end ? (m.left === 0 ? '오늘까지' : m.left + '일 남음') : '기간 확인 필요';
  const sub = (rx ? '최근 처방' + (m.end ? ' · ' + korDate(m.end) + '까지' : '') : '꾸준히 먹는 약') + (m.how ? ' · ' + m.how : '');
  return `<div class="med ${rx ? 'rx' : 'keep'}"><div class="mn"><b>${esc(m.name)}</b><span>${esc(sub)}</span></div>
    <span class="mtag">${tag}</span><button class="mx" onclick="delMed('${esc(m.id)}')" aria-label="약 목록에서 빼기">×</button></div>`;
}

        <span class="small"><span class="lg keep"></span>꾸준히 먹는 약<span class="lg rx"></span>최근 처방 약</span></div>
      ${meds.length ? `<div class="meds">${meds.map(medHTML).join('')}</div>`

/* 환자 사진: 휴대폰·컴퓨터에서 고른 사진을 작게 줄여서 저장 */
function pickPhoto(){ document.getElementById('filePhoto').click(); }
function resizeImage(file, max){
  return new Promise((ok, fail) => {
    const img = new Image();
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
      ok(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = fail; img.src = URL.createObjectURL(file);
  });
}
document.getElementById('filePhoto').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let b64; try { b64 = await resizeImage(f, 600); } catch(err){ toast('사진을 읽지 못했어요. 다른 사진을 골라 주세요'); return; }
  S.photo = await call('사진을 저장하는 중이에요', 'saveProfilePhoto', b64, 'image/jpeg');
  toast('사진을 바꿨어요'); drawProfileArea();
};

function showMedForm(){
  document.getElementById('medBox').innerHTML = `<div class="card" style="margin-top:.6rem">
    <label class="f" for="mName" style="margin-top:0">약 이름</label><input id="mName" placeholder="예: 혈압약">
    <label class="f" for="mHow">먹는 방법 (몰라도 돼요)</label><input id="mHow" placeholder="예: 아침 식후 1알">

      <button class="btn" data-v="처방" onclick="pick(this);document.getElementById('mDaysBox').classList.remove('hidden')">기간이 정해진 약</button></div>
    <div id="mDaysBox" class="hidden"><label class="f" for="mDays">며칠 동안 먹나요?</label><input id="mDays" inputmode="numeric" placeholder="예: 7"></div>

}
async function saveMed(){
  const v = id => document.getElementById(id).value.trim();
  const kind = document.querySelector('#mKind .sel').dataset.v, days = parseInt(v('mDays'), 10) || 0;
  if (!v('mName')){ toast('약 이름을 적어 주세요'); return; }
  if (kind === '처방' && (days < 1 || days > 365)){ toast('며칠 동안 먹는지 숫자로 적어 주세요'); return; }
  S.meds = await call('저장하는 중이에요', 'addMed', v('mName'), v('mHow'), kind, days);
  toast('약을 추가했어요'); drawProfileArea();
}
async function delMed(id){
  const m = (S.meds || []).filter(x => x.id === id)[0];
  if (!confirm((m ? '"' + m.name + '"을(를) ' : '이 약을 ') + '복용 중인 약 목록에서 뺄까요?')) return;
  S.meds = await call('저장하는 중이에요', 'removeMed', id);
  toast('목록에서 뺐어요'); drawProfileArea();
}
