<!-- 글꼴: 나눔스퀘어 네오 (네이버, 둥글고 반듯해 읽기 쉬움. 못 불러오면 기기 기본 글꼴) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nanumsquareneo@0.0.5/nanumsquareneovar.css">
<style>
  /* ===== 기본 디자인 규칙: 큰 글씨, 큰 버튼, 의미 있는 색만 ===== */
  :root{
    --fs:20px;                 /* 설정의 글자 크기에 따라 바뀜 */
    --blue:#185FA5; --blue-bg:#E6F1FB; --blue-dk:#0C447C;
    --green:#3B6D11; --green-bg:#EAF3DE; --green-lt:#C0DD97; --green-dk:#27500A;
    --red:#E24B4A; --red-bg:#FCEBEB; --red-bd:#F09595; --red-dk:#791F1F;
    --amber:#BA7517; --amber-bg:#FAEEDA; --amber-lt:#FAC775; --amber-dk:#633806;
    --ink:#2C2C2A; --sub:#5F5E5A; --muted:#888780; --line:#D3D1C7; --soft:#F1EFE8;
  }
  *{box-sizing:border-box}
  html{font-size:var(--fs)}
  body{margin:0;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:#fff;line-height:1.45;-webkit-text-size-adjust:100%}
  .app{max-width:560px;margin:0 auto;padding:1rem .9rem 6.5rem;overflow-x:clip}
  h1{font-size:1.3rem;margin:.2rem 0 .7rem;display:flex;align-items:center;gap:.4rem}
  h2{font-size:1rem;margin:1rem 0 .5rem}
  .sub{color:var(--sub);font-size:.85rem}
  .small{font-size:.75rem;color:var(--sub)}
  .hidden{display:none!important}
  button{font-family:inherit;font-size:1rem;cursor:pointer;color:inherit}
  .btn{display:block;width:100%;min-height:56px;border-radius:16px;border:2px solid #B4B2A9;background:#fff;font-weight:700;padding:.6rem .5rem;text-align:center}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.outline{border-color:var(--blue);color:var(--blue)}
  .btn.dashed{border:2.5px dashed var(--blue);color:var(--blue)}
  .btn.sel{background:var(--blue);border-color:var(--blue);color:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.45rem}
  .grid3 .btn{font-size:.85rem;min-height:52px;padding:.4rem .2rem}
  .card{border:1.5px solid var(--line);border-radius:16px;padding:.7rem .85rem;margin-bottom:.6rem}
  .card b.t{display:block;font-size:.85rem;color:var(--sub);margin-bottom:.1rem}
  .back{border:none;background:none;padding:.2rem .3rem .2rem 0;font-size:1.3rem;font-weight:700;min-height:44px}
  input,textarea,select{font-family:inherit;font-size:1rem;width:100%;border:2px solid #B4B2A9;border-radius:12px;padding:.55rem .7rem;min-height:52px}
  textarea{min-height:90px}
  label.f{display:block;font-weight:700;margin:.7rem 0 .3rem}
  /* 이전 화면 버튼: 화면을 내려도 위쪽에 늘 보임 */
  .topbar{position:sticky;top:0;z-index:5;background:#fff;padding:.5rem 0 .4rem;margin:-1rem 0 .2rem}
  .backbig{display:inline-flex;align-items:center;gap:.35rem;border:2.5px solid var(--ink);border-radius:14px;background:#fff;font-weight:700;font-size:1.05rem;min-height:54px;padding:.3rem 1rem .3rem .7rem}
  .backbig span{font-size:1.5rem;line-height:1}
  ol.steps{margin:.3rem 0 .5rem;padding-left:1.3rem}
  ol.steps li{margin-bottom:.2rem}

  /* 홈 */
  .rec-btn{width:100%;border:none;border-radius:22px;background:var(--red);color:#fff;font-size:1.45rem;font-weight:700;padding:1.1rem .5rem;display:flex;align-items:center;justify-content:center;gap:.6rem;margin-bottom:.7rem}
  .faces{display:flex;justify-content:space-between;gap:.2rem}
  .face{border:none;background:none;padding:0;text-align:center;font-size:min(.65rem,3.3vw);color:var(--sub);flex:1;min-width:0;white-space:nowrap}
  .face .c{width:min(2.6rem,13vw);height:min(2.6rem,13vw);border-radius:50%;border:2.5px solid;margin:0 auto .15rem;display:flex;align-items:center;justify-content:center;background:#fff}
  .face.on .c{color:#fff!important}
  .progress{height:14px;background:#fff;border-radius:7px;margin:.4rem 0 .3rem;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--green);border-radius:7px}
  .visit{border:2px solid var(--blue);background:var(--blue-bg);color:var(--blue-dk);border-radius:18px;padding:.7rem .8rem;display:flex;align-items:center;gap:.7rem;width:100%;text-align:left}
  .dday{background:var(--blue);color:#fff;border-radius:12px;padding:.4rem .55rem;font-weight:700;white-space:nowrap}
  .rec-big{font-size:min(1.75rem,8.5vw);padding:1.7rem .5rem;border-radius:26px;margin-bottom:.8rem;white-space:nowrap}
  .rec-big svg{width:min(3.2rem,13vw)!important;height:min(3.2rem,13vw)!important;flex:none}
  .hcard .hb .dday{display:inline-block;padding:.1rem .5rem;font-size:1.15rem;line-height:1.3}
  .recpanel .timer{font-size:2.6rem;margin:.1rem 0 .9rem}
  .live{background:var(--soft);border-radius:12px;padding:.6rem .7rem;margin:-.6rem 0 .9rem;min-height:4.5rem;max-height:9rem;overflow:auto;font-size:.95rem;line-height:1.5}
  .recpanel{border:3px solid var(--red);border-radius:22px;padding:.9rem;margin-bottom:.8rem;background:#fff}
  .aitag{position:absolute;top:-.55rem;right:.4rem;background:var(--amber);color:#fff;font-size:.6rem;border-radius:6px;padding:0 .35rem}
  /* 진료과 버튼(이름 아래 작은 설명) */
  .btn.dept{position:relative;font-size:.95rem;line-height:1.25}
  .btn.dept small{display:block;font-size:.62rem;font-weight:400;opacity:.75;margin-top:.1rem}
  .dgh{font-size:.8rem;font-weight:700;color:var(--sub);margin:.9rem 0 .35rem}
  /* 요약 결과: 한 줄 요약 · 조심할 것 체크리스트 · 응급 신호 · 검사 · 다시 여쭤볼 것 */
  .brief{font-size:1.05rem;font-weight:700;color:var(--blue-dk);background:var(--blue-bg);border-radius:14px;padding:.6rem .85rem;margin-bottom:.6rem}
  .care{background:var(--red-bg);border-color:var(--red-bd)}
  .care-h{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.45rem;color:var(--red-dk)}
  .care-h b{font-size:1rem}

  /* 진료과: 고르기 버튼 한 줄 + 아래에서 올라오는 전체 목록 */

  /* 기록 목록 진료과 칩: 휴대폰은 한 줄로 옆으로 밀어 보기 */
  .chips.scroll{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:.1rem .1rem .35rem;margin:0 -.9rem .5rem;padding-left:.9rem;padding-right:.9rem}

  /* 휴대폰 건강관리: 시간대마다 색깔 테두리 상자 */

  /* 빼기 버튼: 평소엔 숨기고, 할 일을 2초 꾹 누르면 그 줄에만 나타나요 */

  /* 몸 상태 기록: 직접 추가 */

  /* 휴대폰 건강관리 상자: 모두 같은 연두색 */
  .pslot.s1,.pslot.s2,.pslot.s3,.pslot.s4{--slot-c:#4F9A2C;--slot-bg:#F1F8EA}

  /* 진료 기록 지우기 */

  .rec.picked,.rcard.picked{border:2.5px solid var(--red)!important;background:var(--red-bg)!important}
  .delbar{position:sticky;bottom:calc(5.4rem + env(safe-area-inset-bottom));z-index:6;display:flex;align-items:center;gap:.45rem;background:#fff;border:2px solid var(--red-bd);border-radius:16px;padding:.5rem .55rem .5rem .8rem;box-shadow:0 6px 20px rgba(0,0,0,.12);margin-top:.6rem}

  .del-ico{width:3.6rem;height:3.6rem;border-radius:50%;background:var(--red-bg);color:var(--red);display:flex;align-items:center;justify-content:center;margin:0 auto}

  @media (min-width:900px){ .rc-bar .chips.scroll{margin:0} .delbar{bottom:1rem} }
  @media (min-width:900px){ .chips.scroll{flex-wrap:wrap;overflow:visible;margin:0 0 .6rem;padding:0} }
  .hcard{border:2px solid;border-radius:18px;padding:.7rem .75rem;text-align:left;display:flex;flex-direction:column;min-height:9rem;min-width:0}

  /* 녹음 */
  .consent{background:var(--amber-bg);color:var(--amber-dk);border-radius:16px;padding:.8rem;margin-bottom:1.4rem}

  /* 기록 목록 */

  /* 할 일 체크 */

  /* 기록(이벤트) */

  /* 복용 중인 약: 꾸준히 먹는 약(초록 실선) / 최근 처방 약(주황 점선) */

  .med .mn{flex:1;min-width:0}
  .med .mn b{display:block}
  .med .mn span{font-size:.75rem;color:var(--sub)}
  .mtag{font-size:.7rem;font-weight:700;border-radius:999px;padding:.15rem .55rem;white-space:nowrap}
  .med.keep .mtag{background:var(--green);color:#fff}
  .med.rx .mtag{background:var(--amber-bg);color:var(--amber-dk)}
  .mx{border:none;background:none;color:var(--muted);font-size:1.2rem;min-height:44px;min-width:40px;flex:none}
  .lg{display:inline-block;width:1rem;height:.7rem;border-radius:3px;vertical-align:-1px;margin:0 .2rem 0 .5rem}
  .lg.keep{background:var(--green-bg);border:1.5px solid #97C459}
  .lg.rx{border:2px dashed #EF9F27}

  /* ===== 설정: 글자 크기 끌기 막대 ===== */
  .fs-box{border:1.5px solid var(--line);border-radius:16px;padding:.8rem 1rem .6rem;margin:.4rem 0 .2rem}
  .fs-prev{text-align:center;font-weight:700;font-size:1.1rem;margin-bottom:.4rem}
  .fs-row{display:flex;align-items:center;gap:.9rem}
  .fs-track{position:relative;flex:1;padding-bottom:28px}
  #fsRange{-webkit-appearance:none;appearance:none;display:block;width:100%;height:32px;background:transparent;border:none;padding:0;margin:0;min-height:0;cursor:pointer}
  #fsRange::-webkit-slider-runnable-track{height:4px;background:var(--ink);border-radius:2px}
  #fsRange::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--blue);border:4px solid #fff;box-shadow:0 0 0 2px var(--blue);margin-top:-13px}
  #fsRange::-moz-range-track{height:4px;background:var(--ink);border-radius:2px}
  #fsRange::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--blue);border:4px solid #fff;box-shadow:0 0 0 2px var(--blue)}
  #fsRange:focus-visible{outline:3px solid var(--blue-bg);border-radius:8px}
  .fs-ticks{position:absolute;left:0;right:0;top:32px;height:26px}
  .fs-ticks button{position:absolute;transform:translateX(-50%);border:none;background:none;font-size:12px;color:var(--sub);white-space:nowrap;padding:0;min-height:0;line-height:1.2}
  .fs-ticks button::before{content:"";display:block;width:2px;height:7px;background:var(--muted);margin:0 auto 2px}

  /* ===== 들었닥 배너 (홈 맨 위) ===== */
  .hero{background:linear-gradient(135deg,var(--green-bg),var(--blue-bg));border-radius:20px;padding:.9rem 1rem;margin-bottom:.8rem}
  .hero .logo{font-size:1.5rem;font-weight:800;color:var(--green-dk);letter-spacing:.06em;line-height:1.1}
  .hero .slogan{font-size:.9rem;font-weight:700;color:var(--blue-dk);margin:.3rem 0 0;word-break:keep-all}
  .hero .desc{display:none;font-size:.8rem;color:var(--sub);margin:.5rem 0 0;word-break:keep-all}
  .greet{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:.2rem .6rem;margin-bottom:.6rem}
  .greet h1{margin:0}

  /* ===== 홈 본문 =====
     휴대폰: 녹음 → (오늘 할 일 | 다음 진료) → 몸 상태, 위에서 아래로
     컴퓨터: 왼쪽(다음 진료 위, 오늘 할 일 아래) · 가운데(동그란 녹음 버튼) · 오른쪽(몸 상태 기록) */
  .home-grid{display:flex;flex-direction:column}
  .h-center{order:1}
  .h-left{order:2;display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
  .h-left .task-card{order:-1}
  .h-right{order:3;margin-top:.7rem}
  .mood-card .mt{font-weight:700;margin-bottom:.4rem}
  .mood-card .mnote{display:none}

  /* 사이드바 위쪽 앱 이름 (컴퓨터에서만 보임) */
  nav.tabs .brand{display:none}

  /* ================= 컴퓨터(넓은 화면) ================= */
  @media (min-width:900px){
    /* 2. 카테고리 바를 왼쪽에 */
    :root{--side:clamp(230px,11rem,340px)}
    nav.tabs{top:0;bottom:0;right:auto;width:var(--side);display:flex;flex-direction:column;gap:.35rem;padding:1.4rem .8rem;border-top:none;border-right:1.5px solid var(--line)}
    nav.tabs .brand{display:block;padding:0 .7rem 1rem;margin-bottom:.5rem;border-bottom:1.5px solid var(--soft)}
    nav.tabs .brand b{display:block;font-size:1.7rem;color:var(--green-dk);letter-spacing:.06em}
    nav.tabs .brand span{display:block;font-size:.65rem;color:var(--sub);line-height:1.4;margin-top:.2rem;word-break:keep-all}
    nav.tabs button{display:flex;align-items:center;gap:.7rem;width:100%;min-height:64px;padding:.5rem .9rem;border-radius:14px;font-size:1rem;text-align:left}
    nav.tabs button svg{margin:0;flex:none}
    nav.tabs button:hover{background:var(--soft)}
    nav.tabs button.on{background:var(--blue-bg)}
    #tabs:not(.hidden) ~ .app{margin-left:var(--side)}
    .app{max-width:1100px;padding:1.6rem 2.4rem 2.4rem}
    .app[data-view="home"]{max-width:none}
    .topbar{margin:-1.6rem 0 .4rem;padding-top:1rem}
    #toast{left:calc(50% + var(--side) / 2);bottom:2rem}

    /* 3. 홈 위쪽 1/4: 들었닥 설명 배너 */
    .hero{min-height:25vh;display:flex;flex-direction:column;justify-content:center;padding:1.6rem 2.4rem;border-radius:28px;margin-bottom:1.1rem}
    .hero .logo{font-size:2.8rem}
    .hero .slogan{font-size:1.35rem;margin-top:.5rem}
    .hero .desc{display:block;font-size:.9rem;max-width:44em}

    /* 4. 왼쪽 · 가운데(녹음) · 오른쪽 */
    .h-center{display:flex;flex-direction:column;align-items:center;justify-content:center}
    .h-center #recSlot{width:100%}
    .h-center .rec-big{width:clamp(220px,19vw,300px);height:auto;aspect-ratio:1/1;border-radius:50%;flex-direction:column;gap:.5rem;margin:14px auto 1.6rem;padding:1rem;font-size:1.35rem;white-space:normal;box-shadow:0 0 0 14px var(--red-bg)}
    .h-center .rec-big svg{width:3.8rem!important;height:3.8rem!important}
    .h-center .upl{max-width:420px}
    .hcard{min-height:0;height:100%;padding:1.1rem 1.3rem}
    .hcard .ht{font-size:.95rem}
    .hcard .hb{font-size:1.9rem}
    .hcard .hs{font-size:.85rem}
    .h-right .mood-card{margin:0;display:flex;flex-direction:column;justify-content:center;gap:.9rem;padding:1.3rem 1.2rem;border-width:2px}
    .mood-card .mt{font-size:1.15rem;margin:0}
    .mood-card .mnote{display:block}
    .h-right .faces{flex-wrap:nowrap}
    .h-right .face{flex:1 1 0;min-width:0;font-size:.7rem;white-space:normal;line-height:1.2}
    .h-right .face .c{width:min(3.3rem,92%);height:auto;aspect-ratio:1/1}

    /* 4. 아주 넓은 화면(1100px 이상)에서 왼쪽 · 가운데 · 오른쪽 세 칸 */
    /* html.roomy = 화면 폭이 글자 크기에 비해 넉넉할 때(글자를 아주 크게 하면 한 줄씩 쌓여요) */
    @media (min-width:1100px){
      html.roomy .home-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,1.15fr) minmax(0,1fr);gap:1.4rem;align-items:stretch;min-height:calc(75vh - 11rem)}
      html.roomy .h-left, html.roomy .h-center, html.roomy .h-right{order:0;margin:0}
      html.roomy .h-left{grid-template-columns:1fr;grid-auto-rows:1fr;gap:1rem}
      html.roomy .h-left .task-card{order:0}
      html.roomy .h-right .mood-card{height:100%}
    }
    #sheet{align-items:center}
    .sheet-box{border-radius:22px;max-width:520px}
    @media (min-width:1100px){
      .app[data-view="health"]{max-width:none;padding-bottom:1.2rem}
      .hw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr) minmax(0,1.2fr);gap:1.2rem;height:calc(100vh - 2.8rem);min-height:560px}
      .hw-col{border:1.5px solid var(--line);border-radius:20px;padding:1rem 1.1rem;overflow:auto;min-height:0}
      .hw-cal{display:flex;flex-direction:column}
      .hw-cal .cal-big{flex:1;min-height:18rem}
      .hw-cal .cal-big button{height:auto;min-height:2.6rem}
    }
    body{word-break:keep-all}   /* 컴퓨터에서만: 낱말 중간에서 줄바꿈하지 않기 */

    /* 녹음 결과 · 기록 상세: 왼쪽 요약 카드 | 오른쪽 고정 칸 */
    .app[data-view="result"]{max-width:1300px}
    .app[data-view="records"],.app[data-view="detail"]{max-width:1300px}
    .rs-title{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.9rem}
    .rs-title h1{margin:0}
    .rs{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,22rem);gap:1.6rem;align-items:start}
    .rs-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
    .rs-cards .card{margin:0;padding:1rem 1.1rem}
    .rs-cards .span2{grid-column:1/-1}
    .rs-cards .big{font-size:1.1rem}
    .rs-side{position:sticky;top:1rem;display:flex;flex-direction:column;gap:.8rem}
    .rs-side .card,.rs-side .player{margin:0}
    .terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.6rem}
    .terms .card{margin:0}
    .act{display:flex;flex-direction:column;gap:.5rem}
    .act .btn{display:flex;align-items:center;justify-content:center;gap:.5rem}
    .meta{display:grid;grid-template-columns:auto 1fr;gap:.25rem .8rem;font-size:.9rem;margin-top:.3rem}
    .meta b{color:var(--sub);font-weight:700}

    /* 기록·요약 목록: 카드 여러 줄 */
    .rc-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.6rem}
    .rc-head h1{margin:0}
    .rc-head input{max-width:24rem}
    .rc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:.9rem}
    .rcard{display:flex;gap:.9rem;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:1rem;min-height:8rem;position:relative}
    .rcard:hover{border-color:var(--blue)}
    .rcard.new{border:2.5px solid var(--blue);background:var(--blue-bg)}
    .rc-date{flex:none;width:4.2rem;text-align:center;background:var(--soft);border-radius:14px;padding:.45rem 0}
    .rcard.new .rc-date{background:#fff}
    .rc-date b{display:block;font-size:1.7rem;line-height:1.1}
    .rc-date span{font-size:.7rem;color:var(--sub)}
    .rc-body{flex:1;min-width:0}
    .rc-dept{font-weight:800;font-size:1.05rem}
    .rc-hosp{font-size:.75rem;color:var(--sub)}
    .rc-body p{margin:.35rem 0 0;font-size:.85rem;color:var(--sub);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .rcard .badge{position:absolute;top:.6rem;right:.7rem}
    /* 설정 */
    .only-desk{display:block}
    .only-phone{display:none!important}
    .app[data-view="settings"]{max-width:1400px}
    .pcard{grid-template-columns:9rem 1fr;column-gap:1.6rem;row-gap:1rem;padding:1.4rem 1.6rem}
    .ph{grid-row:span 2;width:9rem;height:11.5rem}
    .pc-id{flex-direction:row;align-items:flex-start;justify-content:space-between}
    .pc-name{font-size:1.8rem}
    .pc-grid{grid-column:2;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
    .pc-meds{grid-column:1/-1}
    .meds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
    .pf-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4rem;align-items:start}
    .set-sec.wide{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);column-gap:1.6rem;align-items:center}
    .set-sec.wide .gh{grid-column:1/-1}
    .set-sec{border:1.5px solid var(--line);border-radius:18px;padding:.4rem 1rem .8rem}
    /* 기록 목록은 두 줄로 */
  }
  /* ================================================================
     들었닥 테마 — 앱 아이콘에 맞춘 색
     짙은 소나무색(타일) · 새싹 연두(잎) · 따뜻한 흰색(십자)
     기존 색 이름(--blue, --green …)을 그대로 쓰고 값만 바꿔서, 화면 배치는 그대로 두고 색만 갈아입혀요.
     ================================================================ */
  :root{
    --pine:#156548; --pine-dk:#014C34; --pine-ink:#0B3B2A;
    --mint:#C3EBB5; --mint-2:#9FD59F; --cream:#FDFAF7; --bg:#F4F7F2;
    --blue:#156548; --blue-bg:#E7F2EB; --blue-dk:#0B3B2A;          /* 주요 버튼·선택·진료 일정 → 소나무색 */
    --green:#3F8E45; --green-bg:#EDF7E9; --green-lt:#C3EBB5; --green-dk:#24612B;   /* 다 한 일 → 새싹 연두 */
    --red:#D2504A; --red-bg:#FBEEEC; --red-bd:#EDA9A3; --red-dk:#8A2A22;
    --ink:#1F2A24; --sub:#56625A; --muted:#86918A; --line:#DCE5DA; --soft:#EEF3EC;
    --shadow:0 1px 2px rgba(1,76,52,.06),0 6px 18px rgba(1,76,52,.07);
  }
  body{background:var(--bg);font-family:"NanumSquareNeoVar","NanumSquareNeo","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;letter-spacing:-.005em;line-height:1.5}
  button,input,textarea,select{font-family:inherit}
  h1{color:var(--pine-ink)}
  .topbar{background:var(--bg)}
  .backbig{border-color:var(--pine-ink);color:var(--pine-ink);background:#fff}
  .card{background:#fff;border-color:var(--line);box-shadow:var(--shadow)}
  .card.warn{background:var(--red-bg);border-color:var(--red-bd)}
  .btn{border-color:#C9D5C7;background:#fff}
  .btn.primary{background:linear-gradient(145deg,#1B7352,#0A5338);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(1,76,52,.22)}
  .btn.dark{background:var(--pine-ink);border-color:var(--pine-ink)}
  .btn.outline{border-color:var(--pine);color:var(--pine);background:#fff}
  .btn.dashed{border-color:var(--mint-2);color:var(--pine);background:rgba(195,235,181,.16)}
  .btn.sel,.chip.sel,.seg button.sel{background:var(--pine);border-color:var(--pine);color:#fff}
  .btn.danger,.rm.danger{border-color:var(--red-bd);color:var(--red-dk);background:#fff}
  .chip,.seg button,.rm{border-color:#C9D5C7;background:#fff}
  input,textarea,select{border-color:#C9D5C7;background:#fff}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 4px rgba(195,235,181,.65)}
  .h1-ico{width:1.7em;height:1.7em;border-radius:24%;flex:none;box-shadow:0 2px 6px rgba(1,76,52,.2)}

  /* 녹음 버튼: 홈에서 가장 눈에 띄게 빨간색 */
  .rec-btn{background:linear-gradient(145deg,#F0574F,#CC2E2E);box-shadow:0 8px 22px rgba(204,46,46,.32)}
  .rec-btn:active{transform:scale(.98)}
  .recpanel{border-color:#E0463F;box-shadow:0 6px 20px rgba(204,46,46,.15)}
  .recdot{color:var(--red)}
  .live{background:var(--soft)}

  /* 홈 카드: 녹음 버튼이 돋보이게 둘 다 밝은 색 (다음 진료는 연한 초록, 오늘 할 일은 새싹 연두) */
  .hcard{box-shadow:var(--shadow)}
  .hcard.visit-card{background:#fff!important;border-color:var(--pine)!important;color:var(--pine-ink)!important}
  .hcard.visit-card .dday{background:var(--pine);color:#fff}
  .hcard.task-card{border-color:var(--mint-2)!important}
  .progress{background:#fff}
  .progress i{background:linear-gradient(90deg,var(--mint-2),var(--green))}
  .dday{background:var(--pine)}

  /* 목록 · 할 일 · 달력 */
  .rec{border-color:var(--line);box-shadow:var(--shadow)}
  .rec.new{border-color:var(--pine);background:var(--blue-bg)}
  .badge{background:var(--pine)}
  .ck{background:#fff;border-color:var(--line)}
  .ck.done{background:var(--green-bg);border-color:var(--mint-2);color:var(--green-dk)}
  .slot{color:var(--pine)}
  .cal button{border-color:var(--soft);background:#fff}
  .cal button.today{border:2.5px solid var(--pine-ink)}
  .tog.on{background:var(--green)}
  .player{background:var(--soft)}
  .pf{border-bottom-color:var(--line)}
  .row{border-bottom-color:var(--line)}
  .av{background:var(--green-bg);color:var(--pine-dk)}
  .med.keep{border-color:var(--mint-2)}
  .pcard{border-color:var(--pine);box-shadow:var(--shadow)}
  .ph{background:var(--green-bg)}
  .s2{--slot-c:#1F7A6C;--slot-bg:#EAF5F2}
  .s3{--slot-c:#C0392B;--slot-bg:#FDEEEC}

  /* 아래 탭(휴대폰) */
  nav.tabs{background:rgba(255,255,255,.97);border-top-color:var(--line);box-shadow:0 -4px 16px rgba(1,76,52,.06)}
  nav.tabs button.on{color:var(--pine)}
  nav.tabs button.on svg{stroke-width:2.4}

  /* 로딩 · 알림 */
  #toast{background:var(--pine-ink)}
  .spin{border-color:var(--green-bg);border-top-color:var(--pine)}
  #sheet{background:rgba(11,59,42,.45)}
  nav.tabs .brand b{display:flex;align-items:center;gap:.5rem}
  .brand-ico{width:1.5em;height:1.5em;border-radius:24%}

  @media (min-width:900px){
    /* 왼쪽 메뉴: 아이콘 타일처럼 짙은 소나무색 바탕 */
    nav.tabs{background:linear-gradient(180deg,#14634A 0%,#01412D 100%);border-right:none;box-shadow:none}
    nav.tabs .brand{border-bottom-color:rgba(255,255,255,.14)}
    nav.tabs .brand b{color:#fff}
    nav.tabs .brand span{color:var(--mint)}
    nav.tabs button{color:rgba(255,255,255,.8)}
    nav.tabs button:hover{background:rgba(255,255,255,.08)}
    nav.tabs button.on{background:var(--mint);color:var(--pine-dk)}
    nav.tabs button.on:hover{background:var(--mint)}

    /* 홈 위쪽 배너: 밝은 새싹색 + 연두 잎사귀 곡선 (녹음 버튼보다 튀지 않게) */
    .hero{position:relative;overflow:hidden;flex-direction:row;align-items:center;justify-content:flex-start;gap:2rem;
      background:linear-gradient(135deg,#E6F4DF 0%,#F2F9EE 60%,#FBFDF9 100%);color:var(--pine-ink);border:1.5px solid #D5EBCB;box-shadow:var(--shadow)}
    .hero::before{content:"";position:absolute;right:-8%;top:-55%;width:48%;height:210%;border-radius:50%;border:2.6rem solid rgba(159,213,159,.25);transform:rotate(-22deg)}
    .hero::after{content:"";position:absolute;right:6%;top:18%;width:18%;height:120%;border-radius:50%;border:1rem solid rgba(159,213,159,.2);transform:rotate(-30deg)}
    .hero-ico{width:7.5rem;height:7.5rem;border-radius:24%;flex:none;position:relative;z-index:1;box-shadow:0 8px 24px rgba(0,0,0,.25)}
    .hero-txt{position:relative;z-index:1}
    .hero .logo{color:var(--pine-dk)}
    .hero .slogan{color:var(--pine)}
    .hero .desc{color:var(--sub)}
    .hero-ico{box-shadow:0 8px 22px rgba(1,76,52,.2)}
    .h-center .rec-big{box-shadow:0 0 0 14px rgba(240,87,79,.16),0 16px 34px rgba(204,46,46,.32)}
    .mood-card{border-color:var(--line)!important}

    /* 칸 · 카드 */
    .hw-col,.set-sec{background:#fff;border-color:var(--line);box-shadow:var(--shadow)}
    .rcard{border-color:var(--line);box-shadow:var(--shadow)}
    .rcard:hover{border-color:var(--pine)}
    .rcard.new{border-color:var(--pine);background:var(--blue-bg)}
    .rc-date{background:var(--green-bg);color:var(--pine-dk)}
    .fs-box{background:#fff}
    #fsRange::-webkit-slider-runnable-track{background:var(--pine-ink)}
  }
</style>
</head>
<body>
<!-- 카테고리 바: 휴대폰은 아래쪽, 컴퓨터는 왼쪽 (화면 너비에 따라 CSS가 바꿔요) -->
<nav class="tabs" id="tabs">
  <div class="brand"><b><img class="brand-ico" data-app-icon alt="">들었닥</b><span>듣는 순간부터 시작되는<br>나만의 건강관리</span></div>
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>홈</button>
  <button data-tab="records"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>기록·요약</button>
  <button data-tab="health"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>건강관리</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>설정</button>
</nav>
<div class="app" id="app"></div>

<div id="loading" class="hidden"><div class="spin"></div><div id="loadingMsg">불러오는 중이에요</div></div>
<div id="toast" class="hidden"></div>
<div id="doctor" class="hidden"></div>
<div id="sheet" class="hidden" onclick="closeSheet()"></div>
<input type="file" id="filePhoto" accept="image/*" class="hidden">
<input type="file" id="fileAny" accept="audio/*,.m4a,.mp3,.wav,.aac,.ogg,.webm" class="hidden">

<script>
/* ================= 공통 ================= */
const $app = document.getElementById('app');
const S = { settings:{}, view:'home', ev:{}, rec:null, filter:'전체', query:'', month:null, recordsCache:[] };
const FACE_COLORS = ['#3B6D11','#639922','#888780','#BA7517','#A32D2D'];
const FACE_LABELS = ['아주 좋음','좋음','보통','나쁨','아주 나쁨'];
const MOUTHS = ['M8 14c2 3 6 3 8 0','M8.5 14.5c2 1.5 5 1.5 7 0','M8.5 15h7','M8.5 16c2-1.5 5-1.5 7 0','M8 17c2-3 6-3 8 0'];
const KIND_LABEL = {'아픔':'통증','넘어짐':'넘어짐','약못먹음':'약 못 먹음','어지러움':'어지러움','잠못잠':'잠 못 잠','못먹음':'못 먹음','직접추가':'직접 추가','측정':'혈압·혈당'};
const WEEK = ['월','화','수','목','금','토','일'];

/* 외부(깃허브 페이지 등)에 올려 쓸 때: 앱스 스크립트 웹앱 배포 주소를 넣으세요. */
const API_URL = 'https://script.google.com/macros/s/AKfycbxf6jElyDzl6b__XqxVz5Lo-d3Zf29q98WT1HIaJgamUfgO7yetju00wx4dADZkHYpjaA/exec';

/** 서버 함수를 Promise로 부르는 도구
 *  - 앱스 스크립트 안에서 열면 google.script.run 사용
 *  - 외부 주소에서 열면 API_URL로 요청 (마이크 녹음이 되는 방식) */
function run(fn, ...args){
  if (window.google && google.script && google.script.run){
    return new Promise((ok, fail) => google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[fn](...args));
  }
  let token = '';
  try { token = localStorage.getItem('aihh_token') || ''; } catch(e){}
  if (!token){
    token = (prompt('처음 한 번만 접속 비밀번호를 입력해 주세요') || '').trim();
    try { localStorage.setItem('aihh_token', token); } catch(e){}
  }
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]{20,}\/exec/.test(API_URL)) return Promise.reject(new Error('NO_API_URL'));   // …/exec 형식의 실제 주소가 아니면
  return fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({fn, args, token}) })
    .catch(() => { throw new Error('NO_CONNECT'); })                       // 서버까지 못 감(Failed to fetch)
    .then(r => r.json().catch(() => { throw new Error('NO_CONNECT'); }))    // 구글 로그인 화면 등 JSON이 아닌 답
    .then(j => {
      if (!j.ok){
        if (/비밀번호/.test(j.error)) { try { localStorage.removeItem('aihh_token'); } catch(e){} }
        throw new Error(j.error);
      }
      return j.data;
    });
}
/** 로딩 화면을 보여주며 서버를 부릅니다. 오류는 쉬운 말로 알려줍니다. */
/* 화면을 옮긴 뒤 늦게 도착한 '불러오기' 결과는 버려요(다른 화면을 덮어쓰지 않게) */
const STALE = {stale: true};
const LOADS = ['getHomeData','getRecords','getRecord','getVisitPrep','getCalendar','getDay','getSettingsData','getTasks','getTaskGroups'];
window.addEventListener('unhandledrejection', e => { if (e.reason === STALE || (e.reason && e.reason.shown)) e.preventDefault(); });
/** 오류를 어르신·가족이 이해할 수 있는 말로 바꿔요 */
function friendlyError(e){
  const m = String((e && e.message) || e || '').replace('Error: ', '');
  if (m === 'NO_API_URL') return {title:'서버 주소가 아직 비어 있어요', body:'index.html의 API_URL 줄에 앱스 스크립트 "웹 앱 URL"(…/exec)을 넣어 주세요.'};
  if (m === 'NO_CONNECT' || /Failed to fetch|NetworkError|Load failed|network/i.test(m))
    return {title:'서버에 연결하지 못했어요', body:'① 인터넷이 연결돼 있는지 ② index.html의 API_URL이 맞는지(…/exec로 끝나요) ③ 앱스 스크립트 배포의 "액세스 권한"이 "모든 사용자"인지 ④ 코드를 고친 뒤 "배포 관리 → 새 버전"으로 배포했는지 확인해 주세요.'};
  if (/setup\(\)/.test(m)) return {title:'처음 설정이 아직 안 됐어요', body:'앱스 스크립트 편집기에서 setup 함수를 한 번 실행해 주세요.'};
  if (/비밀번호/.test(m)) return {title:'접속 비밀번호가 맞지 않아요', body:'다시 열면 비밀번호를 물어봐요. 앱스 스크립트 "스크립트 속성"의 APP_TOKEN 값을 넣어 주세요.'};
  if (/알 수 없는 요청/.test(m)) return {title:'서버 코드가 예전 버전이에요', body:'앱스 스크립트에 새 Code.gs를 넣고 "배포 관리 → 새 버전"으로 다시 배포해 주세요.'};
  if (/\(429\)|너무 바빠요/.test(m)) return {title:'AI가 잠깐 바빠요', body:'1~2분 뒤 "다시 요약하기"를 눌러 주세요. 받아쓴 내용은 이 휴대폰에 남아 있어요.'};
  return {title:'문제가 생겼어요', body:m};
}
/** 화면을 불러오지 못했을 때: 그 탭 화면에 이유와 '다시 시도'를 보여줘요(홈 화면이 남아 있지 않게) */
function showLoadError(e){
  const f = friendlyError(e), t = S.stack[S.stack.length - 1] || {view:'home', args:[]};
  $app.innerHTML = `${S.stack.length > 1 && !ROOTS.includes(t.view) ? pageTop('') : ''}
    <div class="card warn" style="margin-top:1rem">
      <b class="t" style="color:var(--red-dk)">${esc(f.title)}</b>
      <div style="margin-bottom:.8rem">${esc(f.body)}</div>
      <button class="btn primary" onclick="show('${t.view}', S.stack[S.stack.length-1] ? S.stack[S.stack.length-1].args : [])">다시 시도</button>
    </div>`;
}
async function call(msg, fn, ...args){
  const nav = S.navId;
  loading(msg);
  try {
    const r = await run(fn, ...args);
    if (nav !== S.navId && LOADS.includes(fn)) throw STALE;
    return r;
  }
  catch(e){
    if (e !== STALE && nav === S.navId){
      try { e.shown = true; } catch(_){}
      if (LOADS.includes(fn)) showLoadError(e);   // 화면 불러오기 실패 → 그 화면에 안내
      else toast(friendlyError(e).title + (friendlyError(e).title === '문제가 생겼어요' ? ': ' + friendlyError(e).body : ''));
    }
    throw e;
  }
  finally { if (nav === S.navId) loading(); }
}
function loading(msg){
  document.getElementById('loading').classList.toggle('hidden', !msg);
  if (msg) document.getElementById('loadingMsg').innerHTML = msg;
}
let toastT;
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 3000);
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parse(s){ const p = s.slice(0,10).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function korDate(s, withDay){
  const d = parse(s); const w = ['일','월','화','수','목','금','토'][d.getDay()];
  return (d.getMonth()+1)+'월 '+d.getDate()+'일'+(withDay ? ' ('+w+')' : '');
}
function korTime(hm){
  if (!hm) return '';
  const [h, m] = hm.split(':').map(Number);
  return (h < 12 ? '오전 ' : '오후 ') + (h % 12 || 12) + '시' + (m ? ' ' + m + '분' : '');
}
const IN_GAS = !!(window.google && google.script && google.script.run);
/** 앱 아이콘 그림(머리말의 아이콘을 화면 곳곳에서 같이 써요) */
const APP_ICON = (document.querySelector('link[rel="apple-touch-icon"]') || {}).href || '';
document.querySelectorAll('img[data-app-icon]').forEach(i => i.src = APP_ICON);
/** 컴퓨터 화면(900px 이상)인지. 휴대폰 화면은 처음 디자인 그대로, 컴퓨터는 따로 배치해요. */
const DESK = window.matchMedia('(min-width:900px)');
function isDesk(){ return DESK.matches; }
try { DESK.addEventListener('change', () => {
  const t = S.stack[S.stack.length - 1];
  if (t && ['home','records','detail','result','profile','settings','health'].includes(t.view)) show(t.view, t.args);
}); } catch(e){}
/** 아래 화면(하위 화면) 위쪽: 크게 보이는 '이전 화면' 버튼 + 제목 */
function pageTop(title){
  return `<div class="topbar"><button class="backbig" onclick="back()"><span aria-hidden="true">‹</span>이전 화면</button></div><h1>${title}</h1>`;
}


/** 표정 그림 */
function faceSvg(i, filled){
  const c = filled ? '#fff' : FACE_COLORS[i];
  return `<svg viewBox="0 0 24 24" style="width:78%;height:78%;stroke:${c};stroke-width:1.8"><circle cx="9" cy="10" r=".9" fill="${c}"/><circle cx="15" cy="10" r=".9" fill="${c}"/><path d="${MOUTHS[i]}"/></svg>`;
}
function faces(selected, onclick){
  return `<div class="faces">` + FACE_LABELS.map((l, i) => {
    const on = selected === i + 1;
    return `<button class="face ${on ? 'on' : ''}" onclick="${onclick}(${i+1})"><div class="c" style="border-color:${FACE_COLORS[i]};${on ? 'background:'+FACE_COLORS[i] : ''}">${faceSvg(i, on)}</div>${l}</button>`;
  }).join('') + `</div>`;
}

/** 소리로 읽어주기 (설정의 읽어주기 속도 사용) */
function speak(text){
  if (!('speechSynthesis' in window)) { toast('이 휴대폰에서는 소리로 듣기를 쓸 수 없어요'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR'; u.rate = S.settings['읽어주기속도'] === '보통' ? 1.0 : 0.8;
  speechSynthesis.speak(u);
}

/** 설정의 글자 크기를 화면 전체에 적용 */
const FONT_SIZES = {'작게':'16px','보통':'19px','크게':'22px','아주 크게':'26px'};
/** 글자 크기를 화면 전체에 바로 적용하고, 이 휴대폰에도 기억해 둡니다(다음에 열 때 바로 적용). */
/** 글자 크기 값 → px. '크게' 같은 이름(휴대폰 버튼)과 '23px' 같은 숫자(컴퓨터 끌기 막대) 둘 다 받아요. */
function fontPx(v){
  v = v || S.settings['글자크기'];
  if (/^\d{2}px$/.test(v || '')) return Math.min(30, Math.max(16, parseInt(v, 10))) + 'px';
  return FONT_SIZES[v] || FONT_SIZES['크게'];
}
function applyFont(v){
  const size = fontPx(v);
  document.documentElement.style.setProperty('--fs', size);
  document.documentElement.style.fontSize = size;
  try { localStorage.setItem('aihh_font', v || S.settings['글자크기'] || '크게'); } catch(e){}
  updateRoomy();
}
/** 화면 폭 ÷ 글자 크기가 넉넉하면 컴퓨터용 세 칸 배치를 써요 */
function updateRoomy(){
  const fs = parseFloat(getComputedStyle(document.documentElement).fontSize) || 22;
  document.documentElement.classList.toggle('roomy', window.innerWidth / fs >= 50);
}
try { const f = localStorage.getItem('aihh_font'); if (f) applyFont(f); } catch(e){}
updateRoomy();

/* ===== 화면 이동과 '이전 화면' 기록 =====
   홈·기록·건강관리·설정(탭)은 처음 화면, 나머지는 그 위에 쌓이는 화면이에요.
   휴대폰의 뒤로 가기 버튼(제스처)도 같은 방식으로 동작해요. */
const ROOTS = ['home','records','health','settings'];
S.stack = [];
function go(view, ...args){
  if (view === 'health'){ S.hDate = null; S.month = null; }   // 건강관리에 들어올 때는 오늘부터
  if (ROOTS.includes(view)) S.stack = [{view, args}];
  else S.stack.push({view, args});
  pushHist();
  show(view, args);
}
/** 지금 화면을 새 화면으로 바꿔치기(녹음 → 결과처럼 되돌아갈 필요 없는 경우) */
function replaceView(view, ...args){
  S.stack.pop(); S.stack.push({view, args}); show(view, args);
}
function back(){
  if (S.stack.length > 1){ S.stack.pop(); const t = S.stack[S.stack.length - 1]; show(t.view, t.args); }
  else { S.stack = [{view:'home', args:[]}]; show('home', []); }
}
function pushHist(){
  try {
    if (IN_GAS && google.script.history) google.script.history.push({d: S.stack.length});
    else history.pushState({d: S.stack.length}, '');
  } catch(e){}
}
function onHist(state){
  const d = state && state.d;
  if (d && d < S.stack.length){ S.stack = S.stack.slice(0, d); const t = S.stack[d - 1]; show(t.view, t.args); }
  else if (!d && S.stack.length > 1) back();
}
try {
  if (IN_GAS && google.script.history) google.script.history.setChangeHandler(e => onHist(e.state));
  else window.addEventListener('popstate', e => onHist(e.state));
} catch(e){}

function show(view, args){
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  S.navId = (S.navId || 0) + 1; loading();   // 화면을 옮기면 앞 화면의 '불러오는 중'은 닫아요
  S.view = view; $app.dataset.view = view; S.evInline = false; closeSheet();
  const tabOf = {help:'settings',home:'home',upload:'home',result:'home',bodylog:'home',visit:'home',records:'records',detail:'records',health:'health',month:'health',day:'health',settings:'settings',profile:'settings'};
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tabOf[view]));
  document.getElementById('tabs').classList.toggle('hidden', view === 'result');
  window.scrollTo(0, 0);
  if (view !== 'home') $app.innerHTML = '';
  VIEWS[view](...(args || []));
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));

/* ================= 1-1 홈 ================= */
async function viewHome(){
  const nav = S.navId;
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem('aihh_home') || 'null'); } catch(e){}
  renderHome(Object.assign(emptyHome(), cached || {}, {today: ymd(new Date())}));   // '불러오는 중' 없이 바로 보여줘요
  let d;
  try { d = await run('getHomeData'); }
  catch(e){
    if (nav !== S.navId) return;
    const f = friendlyError(e);
    $app.insertAdjacentHTML('afterbegin', `<div class="card warn" style="margin-bottom:.8rem"><b class="t" style="color:var(--red-dk)">${esc(f.title)}</b>
      <div class="small" style="margin-bottom:.6rem">${esc(f.body)}</div><button class="btn" style="min-height:48px" onclick="show('home',[])">다시 시도</button></div>`);
    return;
  }
  if (nav !== S.navId) return;               // 그사이 다른 화면으로 갔으면 덮어쓰지 않아요
  try { localStorage.setItem('aihh_home', JSON.stringify(d)); } catch(e){}
  renderHome(d);
  maybeWelcome();
}
function emptyHome(){ return {name:'', today: ymd(new Date()), settings: S.settings || {}, taskTotal:0, taskDone:0, mood:0, visit:{has:false, eventCount:0}}; }
function renderHome(d){
  S.homeData = d;
  if (d.settings && Object.keys(d.settings).length){ S.settings = d.settings; applyFont(); }
  const pct = d.taskTotal ? Math.round(d.taskDone / d.taskTotal * 100) : 0;
  const v = d.visit;
  const taskCard = (cls) => `<button class="hcard ${cls}" style="background:var(--green-bg);border-color:#97C459;color:var(--green-dk)" onclick="go('health')">
        <span class="ht">오늘 할 일</span>
        <b class="hb">${d.taskDone} / ${d.taskTotal}</b>
        <span class="progress" style="display:block;margin:.35rem 0"><i style="width:${pct}%"></i></span>
        <span class="hs">${d.taskTotal ? pct + '% 했어요' : '아직 없어요'}</span>
      </button>`;
  const visitCard = (cls) => `<button class="hcard ${cls}" style="background:var(--blue-bg);border-color:var(--blue);color:var(--blue-dk)" onclick="go('visit')">
        <span class="ht">다음 진료</span>
        ${v.has
          ? `<b class="hb"><span class="dday">${v.dday === 0 ? '오늘' : 'D-'+v.dday}</span></b>
             <span class="hs" style="font-weight:700">${korDate(v.when, true)}</span>
             <span class="hs">${esc(v.dept || '')}${v.when.length > 10 ? ' ' + korTime(v.when.slice(11)) : ''}</span>`
          : `<b class="hb" style="font-size:1.1rem">+ 일정 넣기</b><span class="hs">아직 없어요</span>`}
        <span class="hs" style="margin-top:auto">기록 ${v.eventCount}건 ›</span>
      </button>`;

  if (!isDesk()){
    /* 휴대폰: 처음 디자인 그대로 */
    $app.innerHTML = `
    <h1><img class="h1-ico" src="${APP_ICON}" alt="">${d.name ? esc(d.name)+' 님, ' : ''}안녕하세요</h1>
    <div class="sub" style="margin:-.5rem 0 .6rem">${korDate(d.today, true)}</div>

    ${pendingHTML()}
    <div id="recSlot">${recSlotHTML()}</div>
    <button class="btn" style="min-height:44px;font-size:.8rem;font-weight:400;border-style:dashed;margin-bottom:.8rem" onclick="go('upload')">녹음 파일 올리기 · 드라이브에서 가져오기 ›</button>

    <div class="pair">
      ${taskCard('task-card')}
      ${visitCard('visit-card')}
    </div>

    <div class="card" style="margin-top:.7rem">
      <div style="font-weight:700;margin-bottom:.4rem">오늘 몸은 어떠세요?</div>
      ${faces(d.mood, 'saveMood')}
      <button class="btn outline" style="margin-top:.6rem;min-height:50px" onclick="go('bodylog')">+ 불편한 점 기록하기</button>
    </div>`;
    return;
  }

   ① 녹음 버튼을 누르면 마이크 소리를 두 갈래로 받아요.

const CHUNK_SEC = 30, PCM_RATE = 16000;
/* [속도·안정 개선]
   - 30초가 지나면 '말이 잠깐 끊긴 순간'에 잘라요(낱말 중간에서 안 잘리게). 38초가 되면 그냥 잘라요.
   - 서버에는 한 번에 2조각까지만 보내요(AI 사용량 제한에 덜 걸리게). 나머지는 줄 서서 기다려요.
   - 종료 후에는 남은 받아쓰기를 최대 20초만 기다리고, 그때까지 모인 글로 바로 요약해요. */
const CHUNK_MAX_SEC = 38, SILENCE_RMS = 0.012, VOICE_RMS = 0.02, MAX_PARALLEL = 2, FINISH_WAIT_MS = 20000;

/* ----- 소리 → WAV 만들기 ----- */
function downsample(input, fromRate, toRate){
  if (fromRate === toRate) return Float32Array.from(input);
  const ratio = fromRate / toRate, n = Math.floor(input.length / ratio), out = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const a = Math.floor(i * ratio), b = Math.min(input.length, Math.floor((i + 1) * ratio));
    let s = 0; for (let j = a; j < b; j++) s += input[j];
    out[i] = s / Math.max(1, b - a);
  }
  return out;
}
function wavBlob(chunks, rate){
  const len = chunks.reduce((a, c) => a + c.length, 0);
  const buf = new ArrayBuffer(44 + len * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + len * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, len * 2, true);
  let o = 44;
  chunks.forEach(c => { for (let i = 0; i < c.length; i++){ const x = Math.max(-1, Math.min(1, c[i])); v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7FFF, true); o += 2; } });
  return new Blob([buf], {type: 'audio/wav'});
}

async function startHomeRec(){
  if (IN_GAS){ showMicHelp(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!navigator.mediaDevices || !AC){ toast('이 브라우저는 녹음을 지원하지 않아요. 크롬이나 사파리로 열어 주세요'); return; }
  const ctx = new AC();                      // 아이폰은 버튼을 누른 그 순간에 만들어야 소리를 받을 수 있어요
  try { ctx.resume(); } catch(e){}
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1}}); }
  catch(e){ try { ctx.close(); } catch(_){} toast('마이크 사용을 "허용"해 주세요. 주소창 옆 자물쇠 → 마이크 → 허용'); return; }
  // [안정 개선] 마이크를 연 뒤에도 소리 처리가 멈춰 있으면 다시 깨워요(아이폰에서 '녹음된 소리가 없어요'가 나던 원인)
  try { if (ctx.state !== 'running') await ctx.resume(); } catch(e){}
  const R = S.rec = {sec:0, paused:false, stopping:false, stream, ctx, finalText:'', interim:'', sr:null,
    pend:[], pendLen:0, samples:0, voiced:0, texts:[], wavs:[], queue:[], active:0, busy:0, idx:0, mr:null, chunks:[],
    startedAt: new Date().toISOString()};
  // ① 다시 듣기용 녹음 파일
  if (window.MediaRecorder){
    const types = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];
    const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
    try {
      R.mr = new MediaRecorder(stream, Object.assign({audioBitsPerSecond: 32000}, mime ? {mimeType: mime} : {}));
      R.mr.ondataavailable = e => { if (e.data.size) R.chunks.push(e.data); };
      R.mr.start(1000);
    } catch(e){ R.mr = null; }
  }
  // ② AI 받아쓰기용 소리(30초쯤마다, 말이 끊긴 순간에 잘라 보내기)
  const src = ctx.createMediaStreamSource(stream);
  const proc = ctx.createScriptProcessor(4096, 1, 1);
  const mute = ctx.createGain(); mute.gain.value = 0;    // 스피커로는 소리가 안 나가게
  proc.onaudioprocess = e => {
    if (!S.rec || S.rec !== R || R.paused || R.stopping) return;
    const part = downsample(e.inputBuffer.getChannelData(0), ctx.sampleRate, PCM_RATE);
    let sum = 0; for (let i = 0; i < part.length; i++) sum += part[i] * part[i];
    const rms = Math.sqrt(sum / Math.max(1, part.length));   // 지금 소리 크기
    R.pend.push(part); R.pendLen += part.length; R.samples += part.length;
    if (rms > VOICE_RMS) R.voiced += part.length;             // 말소리가 있었던 길이(전체 소리를 쌓아 두지 않아 메모리를 아껴요)
    if ((R.pendLen >= PCM_RATE * CHUNK_SEC && rms < SILENCE_RMS) || R.pendLen >= PCM_RATE * CHUNK_MAX_SEC) flushChunk(R);
  };
  src.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
  R.src = src; R.proc = proc;
  if (!IS_MOBILE) startSR();
  R.timer = setInterval(() => {
    if (S.rec === R && !R.paused){ R.sec++; const t = document.getElementById('timer'); if (t) t.textContent = fmtSec(R.sec); }
  }, 1000);
  keepAwake();
  drawRecSlot();
}
/** 모인 소리를 WAV 한 조각으로 만들어 줄에 세워요 */
function flushChunk(R){
  if (!R.pendLen) return;
  const i = R.idx++;
  R.wavs[i] = wavBlob(R.pend, PCM_RATE);
  R.pend = []; R.pendLen = 0;
  R.queue.push(i); pumpQueue(R);
}
/** 동시에 MAX_PARALLEL개까지만 서버에 보내요 */
function pumpQueue(R){
  while (R.active < MAX_PARALLEL && R.queue.length){
    const i = R.queue.shift(); R.active++;
    transcribe(R, i).finally(() => { R.active--; pumpQueue(R); });
  }
}
/** 한 조각 받아쓰기. 실패하면 2.5초 쉬고 한 번 더(종료 후 기다리는 시간이 끝났으면 다시 안 보내요) */
async function transcribe(R, i){
  R.busy++; if (S.rec === R) drawLive();
  for (let attempt = 0; attempt < 2; attempt++){
    try {
      R.texts[i] = String(await run('transcribeChunk', await blobToB64(R.wavs[i]), 'audio/wav') || '').trim();
      if (R.failed) delete R.failed[i];
      R.wavs[i] = null;                      // 다 받아쓴 소리 조각은 버려서 메모리를 아껴요
      saveLive(R);
      break;
    } catch(e){
      R.failed = R.failed || {}; R.failed[i] = String(e.message || e);
      if (attempt === 0 && !R.giveUp) await sleep(2500); else break;
    }
  }
  R.busy--; if (S.rec === R) drawLive();
}
/** 받아쓴 글을 녹음 중에도 휴대폰에 계속 보관해요(앱이 꺼져도 다음에 열면 '다시 요약하기'로 살려요) */
function saveLive(R){ try { localStorage.setItem('aihh_live', JSON.stringify({text: recText(R), at: R.startedAt})); } catch(e){} }
function recoverLive(){
  let live = null;
  try { live = JSON.parse(localStorage.getItem('aihh_live') || 'null'); localStorage.removeItem('aihh_live'); } catch(e){}
  if (live && live.text && live.text.length >= 10 && !getPending()){
    try { localStorage.setItem('aihh_pending', JSON.stringify({text: live.text, at: live.at || new Date().toISOString()})); } catch(e){}
  }
}
/* [안정 개선] 녹음하는 동안 화면이 꺼지지 않게(화면이 꺼지면 휴대폰이 녹음 처리를 멈춰요) */
let wakeLock = null;
async function keepAwake(){
  try {
    if ('wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch(e){}
}
function releaseWake(){ try { if (wakeLock) wakeLock.release(); } catch(e){} wakeLock = null; }
document.addEventListener('visibilitychange', () => {
  const R = S.rec; if (!R) return;
  if (document.visibilityState === 'hidden'){ R.wasHidden = true; return; }
  keepAwake();
  try { if (R.ctx.state !== 'running') R.ctx.resume(); } catch(e){}
  if (R.wasHidden){ R.wasHidden = false; toast('다른 화면에 다녀오는 동안 녹음이 멈췄을 수 있어요. 녹음 중에는 이 화면을 켜 두세요'); }
});
/** 컴퓨터: 브라우저 음성인식으로 바로바로 보이는 글 (AI 받아쓰기가 실패했을 때 대신 쓰기도 해요) */
function startSR(){
  if (!SR) return;
  const r = new SR();
  r.lang = 'ko-KR'; r.continuous = true; r.interimResults = true;
  r.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) S.rec.finalText += t.trim() + ' ';
      else interim += t;
    }
    S.rec.interim = interim; drawLive();
  };
  r.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') S.rec.srBlocked = true; };
  r.onend = () => {
    if (S.rec && S.rec.sr === r && !S.rec.paused && !S.rec.stopping && !S.rec.srBlocked){ try { r.start(); } catch(e){} }
  };
  try { r.start(); S.rec.sr = r; } catch(e){ S.rec.sr = null; }
}
function pauseRec(){
  const R = S.rec; if (!R) return;
  if (!R.paused){
    R.paused = true;
    if (R.mr && R.mr.state === 'recording') try { R.mr.pause(); } catch(e){}
    if (R.sr){ R.finalText += R.interim ? R.interim + ' ' : ''; R.interim = ''; try { R.sr.stop(); } catch(e){} }
  } else {
    R.paused = false;
    if (R.mr && R.mr.state === 'paused') try { R.mr.resume(); } catch(e){}
    if (R.sr){ try { R.sr.start(); } catch(e){} }
  }
  drawRecSlot();
}
function stopRec(){
  const R = S.rec; if (!R || R.stopping) return;
  R.stopping = true;
  clearInterval(R.timer);
  if (R.sr){ try { R.sr.stop(); } catch(e){} }
  flushChunk(R);                                   // 마지막 조각도 바로 받아쓰기 시작
  const done = () => {
    try { R.stream.getTracks().forEach(t => t.stop()); } catch(e){}
    try { R.proc.disconnect(); R.src.disconnect(); R.ctx.close(); } catch(e){}
    finishRec(R);
  };
  if (R.mr && R.mr.state !== 'inactive'){ R.mr.onstop = done; try { R.mr.stop(); } catch(e){ done(); } }
  else done();
}
async function finishRec(R){
  const blob = R.chunks.length ? new Blob(R.chunks, {type: (R.mr && R.mr.mimeType) || 'audio/webm'}) : null;
  S.rec = null; drawRecSlot(); releaseWake();
  // [속도 개선] 남은 받아쓰기는 최대 20초만 기다려요(예전에는 다 끝날 때까지 몇 분이고 기다렸어요)
  const t0 = Date.now();
  while ((R.queue.length || R.active) && Date.now() - t0 < FINISH_WAIT_MS){
    loading('받아쓰기를 마무리하는 중이에요<br><span class="small">' + (R.queue.length + R.active) + '조각 남았어요</span>');
    await sleep(300);
  }
  R.giveUp = true;
  let missing = 0; for (let i = 0; i < R.idx; i++) if (R.texts[i] == null) missing++;
  let text = recText(R);
  const sr = (R.finalText + ' ' + R.interim).trim();
  // AI 받아쓰기가 모자라면 브라우저 음성인식 글로(컴퓨터에서만 있어요)
  if (sr.length >= 10 && (text.length < 10 || (missing && sr.length > text.length))) text = sr;
  try { localStorage.removeItem('aihh_live'); } catch(e){}
  if (text.length < 10){
    loading();
    // [안정 개선] 받아쓰기가 통째로 안 됐어도 말소리가 녹음돼 있으면, 녹음 파일을 AI에 바로 보내 요약해요
    if (blob && R.voiced > PCM_RATE * 3){
      toast('받아쓰기가 안 돼서 녹음 파일로 바로 요약할게요');
      return sendAudio(blob, 'recording.' + extOf(blob.type));
    }
    const why = R.failed ? Object.values(R.failed)[0] : '';
    if (why){ toast('AI 받아쓰기에 실패했어요: ' + friendlyError(why).title); return; }
    toast(R.samples ? '말소리가 거의 들리지 않았어요. 휴대폰을 선생님 쪽에 가까이 두고 다시 녹음해 주세요' : '녹음된 소리가 없어요. 다시 녹음해 주세요');
    return;
  }
  if (missing) toast('받아쓰기 ' + missing + '조각이 늦어서 빼고 요약했어요. 녹음 파일에는 모두 남아 있어요');
  savePending(text, blob);                         // 요약이 실패해도 받아쓴 글이 남도록 먼저 보관
  await summarizePending('AI가 쉬운 말로 요약하는 중이에요<br><span class="small">거의 다 됐어요</span>');
}
/* ----- 요약하지 못한 녹음 보관 · 다시 요약하기 ----- */
function savePending(text, blob){
  try { localStorage.setItem('aihh_pending', JSON.stringify({text, at: new Date().toISOString()})); } catch(e){}
  S.pendingBlob = blob || null;
}
function getPending(){ try { return JSON.parse(localStorage.getItem('aihh_pending') || 'null'); } catch(e){ return null; } }
function clearPending(){ try { localStorage.removeItem('aihh_pending'); } catch(e){} S.pendingBlob = null; }
async function summarizePending(msg){
  const p = getPending(); if (!p) return;
  try {
    const res = await call(msg || 'AI가 다시 요약하는 중이에요', 'processTranscript', p.text, '');
    const blob = S.pendingBlob;
    clearPending();
    const id = openResult(res);
    if (res && res.needFinish) finishLater(id);     // 할 일·약·진료 일정 정리는 결과를 보여준 뒤에
    if (blob) uploadAudioLater(id, blob);
  } catch(e){
    if (S.view === 'home') viewHome();               // 홈에 '다시 요약하기' 카드가 보이게
  }
}
/** 할 일·약·진료 일정 정리(실패하면 한 번 더, 그래도 안 되면 서버가 10분 안에 대신 해요) */
async function finishLater(id){
  for (let i = 0; i < 2; i++){
    try { await run('finishRecord', id); return; } catch(e){ await sleep(3000); }
  }
}
function dropPending(){
  if (!confirm('요약하지 못한 녹음을 지울까요? 받아쓴 글도 함께 지워져요.')) return;
  clearPending(); viewHome();
}
function pendingHTML(){
  const p = getPending(); if (!p) return '';
  const d = new Date(p.at);
  return `<div class="card warn" style="margin-bottom:.7rem">
    <b class="t" style="color:var(--red-dk)">요약하지 못한 진료 녹음이 있어요</b>
    <div class="small" style="margin-bottom:.5rem">${d.getMonth()+1}월 ${d.getDate()}일 ${korTime(String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'))} 녹음 · 받아쓴 글 ${p.text.length.toLocaleString()}자는 이 휴대폰에 그대로 있어요</div>
    <div class="grid2"><button class="btn primary" onclick="summarizePending()">다시 요약하기</button><button class="btn" onclick="dropPending()">지우기</button></div></div>`;
}
/** 서버가 요약과 함께 돌려준 기록으로 결과 창을 바로 열어요(서버를 한 번 더 부르지 않음) */
function openResult(res){
  const id = res && res.id ? res.id : res;
  S.preRec = res && res.record ? res.record : null;
  patchHomeVisit(S.preRec);
  go('result', id);
  return id;
}
/** AI가 찾은 다음 진료일을 홈 화면 보관본에 바로 넣어요(홈으로 가면 서버 응답을 기다리지 않고 새 일정이 보여요).
    이미 더 가까운 일정이 있으면 그대로 둬요. 곧이어 서버에서 받은 값으로 다시 맞춰져요. */
function patchHomeVisit(rec){
  if (!rec || !rec.next) return;
  let h = null;
  try { h = JSON.parse(localStorage.getItem('aihh_home') || 'null'); } catch(e){}
  if (!h) return;
  const today = ymd(new Date()), d = rec.next.slice(0, 10);
  const cur = h.visit || {};
  if (d < today || (cur.has && cur.when && cur.when.slice(0, 10) <= d)) return;
  const dday = Math.round((parse(d) - parse(today)) / 86400000);
  h.visit = Object.assign({}, cur, {has: true, when: rec.next, hospital: rec.hospital || '', dept: rec.aiDept || '', dday});
  try { localStorage.setItem('aihh_home', JSON.stringify(h)); } catch(e){}
}
function blobToB64(blob){
  return new Promise((ok, fail) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = fail; r.readAsDataURL(blob); });
}
function extOf(type){ return /mp4|m4a|aac/.test(type || '') ? 'm4a' : /ogg/.test(type || '') ? 'ogg' : /wav/.test(type || '') ? 'wav' : /mpeg|mp3/.test(type || '') ? 'mp3' : 'webm'; }
async function uploadAudioLater(id, blob){
  if (!blob.size || blob.size > 30 * 1024 * 1024) return;
  try { await run('attachAudio', id, await blobToB64(blob), blob.type || 'audio/webm', 'recording.' + extOf(blob.type)); toast('녹음 파일도 저장했어요'); }
  catch(e){ toast('녹음 파일은 저장하지 못했어요. 요약은 저장됐어요'); }
}

/** 고른 녹음 파일을 AI가 읽을 수 있는 WAV(한 채널)로 바꿔요. 바꾸지 못하면 원래 파일 그대로 보내요. */
async function toWav(blob){
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!OAC) return null;
  const ab = await blob.arrayBuffer();
  const rate = blob.size > 8 * 1024 * 1024 ? 8000 : PCM_RATE;      // 긴 녹음은 더 가볍게
  const dec = await new Promise((ok, fail) => { const p = new OAC(1, rate, rate).decodeAudioData(ab, ok, fail); if (p && p.then) p.then(ok, fail); });
  const mono = new Float32Array(dec.length);
  for (let c = 0; c < dec.numberOfChannels; c++){ const d = dec.getChannelData(c); for (let i = 0; i < d.length; i++) mono[i] += d[i] / dec.numberOfChannels; }
  return wavBlob([downsample(mono, dec.sampleRate, rate)], rate);
}
/** 녹음 파일을 서버로 보내 AI가 정리하면 결과 창을 엽니다. */
async function sendAudio(blob, name){
  loading('녹음 파일을 준비하는 중이에요');
  let send = blob, fname = name || ('recording.' + extOf(blob.type));
  try { const w = await toWav(blob); if (w && w.size < 28 * 1024 * 1024){ send = w; fname = 'recording.wav'; } } catch(e){}
  loading();
  if (send.size > 30 * 1024 * 1024){ toast('녹음 파일이 너무 커요. 드라이브 녹음함에 올려 주세요'); return; }
  try {
    const res = await call('AI가 쉽게 정리하는 중이에요<br><span class="small">녹음을 직접 듣고 정리해서 1~2분 걸릴 수 있어요</span>', 'processRecording', await blobToB64(send), send.type || '', '', fname);
    openResult(res);
  } catch(e){ /* 오류는 call에서 안내 */ }
}

/* ----- 요약 결과 카드 (결과 창 · 기록 상세 공용) ----- */
/** 글 또는 배열을 '한 줄에 하나' 목록으로(예전 기록의 '조심할것' 글도 체크리스트로 보이게) */
function toList(v){
  const arr = Array.isArray(v) ? v : String(v || '').replace(/([.!?。])\s+/g, '$1\n').split(/\n+|[•·]/);
  return arr.map(x => (x && typeof x === 'object') ? (x['내용'] || x['항목'] || x.text || '') : x)
    .map(x => String(x || '').replace(/^\s*(?:[-*]|\d+[.)])\s*/, '').trim()).filter(Boolean);
}
function briefHTML(s){ return s['한줄요약'] ? `<div class="brief span2">${esc(s['한줄요약'])}</div>` : ''; }
function careState(id){ try { return JSON.parse(localStorage.getItem('aihh_care_' + id) || '{}'); } catch(e){ return {}; } }
/** 조심할 것: 한 줄에 하나씩 체크리스트로. 읽고 확인한 항목을 누르면 체크돼요(이 휴대폰에 기억) */
function careHTML(r){
  const items = toList((r.summary || {})['조심할것']);
  if (!items.length) return `<div class="card warn"><b class="t" style="color:#A32D2D">조심할 것</b>-</div>`;
  const st = careState(r.id), n = items.filter((_, i) => st[i]).length;
  return `<div class="card care span2"><div class="care-h"><b>조심할 것</b><span class="small" id="careCnt" style="color:inherit">${n} / ${items.length} 확인</span></div>
    ${items.map((t, i) => `<button class="care-i ${st[i] ? 'on' : ''}" onclick="toggleCare('${esc(r.id)}', ${i}, this, ${items.length})"><span class="bx">${st[i] ? '✓' : ''}</span><span>${esc(t)}</span></button>`).join('')}
    <div class="small" style="color:inherit">읽고 확인한 항목을 눌러 체크해 보세요</div></div>`;
}
function toggleCare(id, i, el, total){
  const st = careState(id); st[i] = !st[i];
  try { localStorage.setItem('aihh_care_' + id, JSON.stringify(st)); } catch(e){}
  el.classList.toggle('on', !!st[i]); el.querySelector('.bx').textContent = st[i] ? '✓' : '';
  const c = document.getElementById('careCnt'); if (c) c.textContent = Object.values(st).filter(Boolean).length + ' / ' + total + ' 확인';
}
function emgHTML(s){
  const em = toList(s['응급신호']);
  return em.length ? `<div class="card emg span2"><b class="t">⚠ 이럴 땐 바로 병원(응급실)에 가세요</b>${em.map(t => `<div class="emg-i">${esc(t)}</div>`).join('')}</div>` : '';
}
function testsHTML(s){
  const ts = (Array.isArray(s['검사']) ? s['검사'] : []).map(t => typeof t === 'string' ? {'이름': t} : (t || {})).filter(t => t['이름'] || t['결과']);
  return ts.length ? `<div class="card"><b class="t">검사</b>${ts.map(t => `<div class="tst"><b>${esc(t['이름'] || '검사')}</b>${
    t['결과'] ? `<span class="tst-r">${esc(t['결과'])}</span>` : ''}${t['설명'] ? `<div class="small">${esc(t['설명'])}</div>` : ''}</div>`).join('')}</div>` : '';
}
function askHTML(s){
  const qs = toList(s['확인필요']);
  return qs.length ? `<div class="card ask span2"><b class="t">선생님께 다시 여쭤보면 좋은 것</b>${qs.map(q => `<div>· ${esc(q)}</div>`).join('')}
    <button class="btn outline" style="margin-top:.5rem;min-height:48px" onclick="addAskQs(this)">"선생님께 물어볼 것"에 넣기</button></div>` : '';
}
/** 조심할 것 자리에 들어가는 카드 묶음: 응급 신호 → 조심할 것 체크리스트 → 검사 → 다시 여쭤볼 것 */
function extraCards(r){ const s = r.summary || {}; return emgHTML(s) + careHTML(r) + testsHTML(s) + askHTML(s); }

    <div class="small" style="margin-bottom:.5rem">누르면 바로 저장돼요</div>${deptButtons(S.detail, 'pickDept')}`;
}

/* ================= 1-3 몸 상태 기록 =================
   휴대폰·홈에서는 한 화면 전체로, 컴퓨터 건강관리에서는 가운데 칸 안(#evForm)에 열려요. */
function newEv(){ return {'기분':0,'종류':'','부위':'','양상':'','정도':'','메모':'','혈압수축':'','혈압이완':'','혈당':'','혈당시점':''}; }
function viewBodylog(){
  S.evInline = false;
  S.ev = S.ev && S.ev.keep ? S.ev : newEv();
  drawBodylog();
}
/* '무슨 일이 있었나요?' 버튼(순서대로). '아픔'은 화면에 '통증'으로 보여요(예전 기록과 맞추려고 저장 이름은 그대로) */
const EV_KINDS = ['넘어짐','약못먹음','아픔','잠못잠','못먹음'];
const PAIN_PARTS = ['무릎','허리','머리','어깨','목','등','배','가슴','손','발'];
const PAIN_TYPES = ['욱신욱신','콕콕 찌름','뻐근함','저림','화끈거림','붓고 아픔'];
function drawBodylog(){
  const host = (S.evInline && document.getElementById('evForm')) || $app;
  const e = S.ev, pain = e['종류'] === '아픔', custom = e['종류'] === '직접추가';
  const sel = (k, v) => !e['_c' + k] && e[k] === v ? 'sel' : '';
  const opt = (k, list, cls) => list.map(v => `<button class="${cls} ${sel(k, v)}" onclick="setEv('${k}','${v}')">${KIND_LABEL[v] || v}</button>`).join('');
  // 부위·양상의 '+ 직접 추가': 누르면 바로 아래에 적는 칸이 나와요
  const own = (k, cls) => `<button class="${cls} dashed ${e['_c' + k] ? 'sel' : ''}" onclick="setCustom('${k}')">+ 직접 추가</button>`;
  const ownInput = (k, ph) => e['_c' + k] ? `<input class="own" id="c_${k}" maxlength="30" placeholder="${ph}" value="${esc(e[k])}" oninput="S.ev['${k}']=this.value">` : '';
  const num = (id, k, ph) => `<input id="${id}" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="${ph}" value="${esc(e[k])}" oninput="S.ev['${k}']=this.value">`;
  host.innerHTML = `
    ${S.evInline ? `<div class="hw-h"><b style="font-size:1.05rem">오늘 몸 상태 기록</b><button class="chip" onclick="closeInlineLog()">닫기</button></div>` : pageTop('몸 상태 기록')}
    <h2>1. 오늘 기분은요?</h2>${faces(e['기분'], 'setMood')}
    <h2>2. 무슨 일이 있었나요?</h2>
    <div class="grid3">${opt('종류', EV_KINDS, 'btn')}
      <button class="btn dashed ${custom ? 'sel' : ''}" onclick="setEv('종류','직접추가')">+ 직접 추가</button></div>
    <div class="small" style="margin-top:.3rem">목록에 없으면 "+ 직접 추가"를 눌러 적어 주세요</div>
    ${pain ? `
      <h2>3. 어디가 아프세요?</h2><div class="chips">${opt('부위', PAIN_PARTS, 'chip')}${own('부위', 'chip')}</div>${ownInput('부위', '예: 발목, 옆구리')}
      <h2>4. 어떻게 아프세요?</h2><div class="grid3">${opt('양상', PAIN_TYPES, 'btn')}${own('양상', 'btn')}</div>${ownInput('양상', '예: 쑤셔요, 당겨요')}
      <h2>5. 얼마나 아프세요?</h2><div class="grid3">${opt('정도', ['조금','많이','아주 많이'], 'btn')}</div>` : ''}
    <h2>혈압 · 혈당 <span class="small" style="font-weight:400">(재셨다면 적어 주세요)</span></h2>
    <div class="vit">
      <div><label for="vS">혈압 높은 쪽 (위)</label>${num('vS', '혈압수축', '예: 130')}</div>
      <div><label for="vD">혈압 낮은 쪽 (아래)</label>${num('vD', '혈압이완', '예: 85')}</div>
      <div><label for="vG">혈당</label>${num('vG', '혈당', '예: 110')}</div>
      <div><label>혈당은 언제 쟀나요?</label><div class="chips">${opt('혈당시점', ['공복','식후','자기 전'], 'chip')}</div></div>
    </div>
    <div class="unit">혈압 단위 mmHg · 혈당 단위 mg/dL</div>
    ${e['종류'] ? `<label class="f" for="memo">${custom ? '어떤 일이 있었나요?' : '더 남길 말 (안 써도 돼요)'}</label>
      <textarea id="memo" placeholder="${custom ? '예: 밥맛이 없어요' : '예: 계단 내려온 뒤'}" oninput="S.ev['메모']=this.value">${esc(e['메모'])}</textarea>` : ''}
    <button class="btn dark" style="margin-top:1rem" onclick="saveEvent()">저장하기</button>`;
}
function setMood(n){ S.ev['기분'] = n; drawBodylog(); }
function setEv(k, v){
  const m = document.getElementById('memo'); if (m) S.ev['메모'] = m.value;
  if (S.ev['_c' + k]){ S.ev['_c' + k] = false; S.ev[k] = v; }   // 직접 추가 중에 목록 버튼을 누르면 그걸로
  else S.ev[k] = S.ev[k] === v ? '' : v;
  if (k === '종류' && S.ev['종류'] !== '아픔'){ S.ev['부위'] = S.ev['양상'] = S.ev['정도'] = ''; S.ev['_c부위'] = S.ev['_c양상'] = false; }
  drawBodylog();
}
/** 부위·양상 '+ 직접 추가' 켜기/끄기 */
function setCustom(k){
  const m = document.getElementById('memo'); if (m) S.ev['메모'] = m.value;
  S.ev['_c' + k] = !S.ev['_c' + k]; S.ev[k] = '';
  drawBodylog();
  const i = document.getElementById('c_' + k); if (i) i.focus();
}
async function saveEvent(){
  const e = S.ev, digits = v => String(v || '').replace(/[^0-9]/g, '');
  const bs = digits(e['혈압수축']), bd = digits(e['혈압이완']), gl = digits(e['혈당']);
  if ((bs && !bd) || (!bs && bd)){ toast('혈압은 위·아래 두 숫자를 모두 적어 주세요'); return; }
  if (bs && (+bs < 50 || +bs > 260 || +bd < 30 || +bd > 160 || +bd >= +bs)){ toast('혈압 숫자를 다시 확인해 주세요'); return; }
  if (gl && (+gl < 20 || +gl > 600)){ toast('혈당 숫자를 다시 확인해 주세요'); return; }
  const vit = !!(bs || gl);
  if (!e['종류'] && !e['기분'] && !vit){ toast('기분이나 있었던 일, 혈압·혈당 중 하나를 적어 주세요'); return; }
  if (e['종류'] === '직접추가' && !String(e['메모']).trim()){ toast('어떤 일이 있었는지 적어 주세요'); return; }
  if (e['종류'] === '아픔' && e['_c부위'] && !String(e['부위'] || '').trim()){ toast('아픈 곳을 적어 주세요'); return; }
  if (e['종류'] === '아픔' && e['_c양상'] && !String(e['양상'] || '').trim()){ toast('어떻게 아픈지 적어 주세요'); return; }
  const data = Object.assign({}, e, {'혈압수축': bs, '혈압이완': bd, '혈당': gl, '혈당시점': gl ? e['혈당시점'] : '',
    '부위': String(e['부위'] || '').trim(), '양상': String(e['양상'] || '').trim()});
  delete data['_c부위']; delete data['_c양상'];
  if (!data['종류'] && vit) data['종류'] = '측정';
  await call('저장하는 중이에요', 'addEvent', data);
  S.ev = {}; toast('기록했어요');
  if (S.evInline){ S.evInline = false; viewHealthWide(); } else back();
}
/** 컴퓨터 건강관리 가운데 칸에서 기록 열기·닫기 */
function openInlineLog(){ S.evInline = true; S.ev = newEv(); drawBodylog(); }
function closeInlineLog(){
  S.evInline = false; S.ev = {};
  const f = document.getElementById('evForm');
  if (f) f.innerHTML = `<button class="btn outline" onclick="openInlineLog()">+ 오늘 몸 상태 기록하기</button>`;
}

/* ================= 1-4 다음 진료 준비 ================= */
function evLine(e){
  const head = (KIND_LABEL[e.kind] || e.kind) + (e.part ? ' · ' + e.part : '');
  const detail = [e.type, e.level].filter(Boolean).join(', ');
  const vit = [e.bpS && e.bpD ? '혈압 ' + e.bpS + '/' + e.bpD : '', e.sugar ? '혈당 ' + e.sugar + (e.sugarWhen ? '(' + e.sugarWhen + ')' : '') : ''].filter(Boolean).join(' · ');
  if (e.kind === '측정') return { head: vit || '혈압·혈당', memo: e.memo, vit: '' };
  return { head: e.kind === '아픔' && e.part ? e.part + ' 통증' + (detail ? ' (' + detail + ')' : '') : head, memo: e.memo, vit };
}
/** 기록 종류별 색: 약 못 먹음은 주황, 혈압·혈당은 파랑, 나머지는 빨강 */
function evCls(kind){ return kind === '약못먹음' ? 'a' : kind === '측정' ? 'm' : ''; }
async function viewVisit(){
  const d = await call('불러오는 중이에요', 'getVisitPrep');

  const v = d.visit, c = d.counts;
  $app.innerHTML = `
    ${pageTop('다음 진료 준비')}
    <div class="card" style="background:var(--blue-bg);border-color:#85B7EB;color:var(--blue-dk)">
      ${v.has ? `<b style="font-size:1.05rem">${korDate(v.when, true)} ${korTime(v.when.slice(11))} · ${v.dday === 0 ? '오늘' : 'D-'+v.dday}</b><div style="font-size:.8rem">${esc(v.hospital||'')} ${esc(v.dept||'')}</div>`
      : `<b>정해진 다음 진료가 없어요</b><div style="font-size:.8rem">진료를 녹음하면 AI가 다음 진료일을 찾아 줘요</div>`}
    </div>
    ${d.upcoming.length > 1 ? `<div class="small" style="margin:-.3rem 0 .4rem">그다음 진료: ${d.upcoming.slice(1).map(u => korDate(u.when) + ' ' + esc(u.dept||'')).join(', ')}</div>` : ''}
    <div class="grid2" style="margin-bottom:.4rem">
      <button class="btn outline" onclick="showVisitForm()">+ 진료 일정 넣기</button>
      <button class="btn" onclick="showVisitList()">일정 지우기</button>
    </div>
    <div id="visitBox"></div>
    <h2>${v.lastDate ? '지난 진료('+korDate(v.lastDate)+') 이후 기록' : '지금까지의 기록'}</h2>
    <div class="stat">
      <div style="border-color:var(--red-bd);color:var(--red-dk)"><b>${c['아픔']||0}</b><span>통증</span></div>
      <div style="border-color:var(--red-bd);color:var(--red-dk)"><b>${c['넘어짐']||0}</b><span>넘어짐</span></div>
      <div style="border-color:#EF9F27;color:var(--amber-dk)"><b>${c['약못먹음']||0}</b><span>약 못 먹음</span></div>
      <div style="border-color:#97C459;color:var(--green-dk)"><b>${d.avg == null ? '-' : d.avg+'%'}</b><span>할 일 평균</span></div>
    </div>
    ${d.events.length ? d.events.map(e => { const l = evLine(e);

    ${d.questions.map(q => `<div class="row"><span>· ${esc(q.text)}</span><button class="chip" style="margin-left:auto" onclick="doneQ('${q.id}')">물어봤어요</button></div>`).join('') || '<div class="sub">적어 둔 질문이 없어요</div>'}

/** 의료진에게 보여줄 큰 글씨 화면 */

/* ================= 2-1 진료 기록 목록 ================= */
async function viewRecords(){
  S.delMode = false; S.delSel = {};
  S.recordsCache = await call('불러오는 중이에요', 'getRecords');
  drawRecords();
}
function drawRecords(){
  const all = S.recordsCache;
  // 자주 가는 진료과는 기록이 없어도 늘 보여주고, 기록에만 있는 진료과는 뒤에 붙여요
  // 기록이 있는 진료과만, 기록이 많은 순으로(휴대폰은 한 줄로 옆으로 밀어 봐요). 진료과를 안 고른 기록은 '미분류'
  const cnt = {}; all.forEach(r => { const k = r.dept || '미분류'; cnt[k] = (cnt[k] || 0) + 1; });
  if (S.filter !== '전체' && !cnt[S.filter]) S.filter = '전체';
  const depts = ['전체', ...Object.keys(cnt).sort((a, b) => (a === '미분류') - (b === '미분류') || cnt[b] - cnt[a])];
  const search = `<input placeholder="검색 (예: 무릎)" value="${esc(S.query)}" oninput="S.query=this.value;drawRecordList()" style="margin-bottom:.5rem">`;
  const chipRow = depts.length > 2 ? `<div class="chips scroll" id="deptChips">${depts.map(d => `<button class="chip ${S.filter===d?'sel':''}" data-d="${esc(d)}" onclick="S.filter=this.dataset.d;drawRecords()">${esc(d)}<span class="n">${d === '전체' ? all.length : cnt[d]}</span></button>`).join('')}</div>` : '<div style="flex:1"></div>';
  // 진료과 줄 오른쪽 끝: 휴지통(누르면 지울 기록 고르기)
  const chips = all.length ? `<div class="rc-bar">${chipRow}<button class="trash ${S.delMode ? 'on' : ''}" onclick="toggleDeleteMode()" aria-label="진료 기록 지우기">${ICON.trash}</button></div>
    ${S.delMode ? `<div class="delhint"><span>지울 기록을 눌러서 골라 주세요</span><button class="chip" onclick="selAllDel()">모두 고르기</button></div>` : ''}` : '';
  $app.innerHTML = isDesk()
    ? `<div class="rc-head"><h1>진료 기록 <span class="sub" style="font-weight:400">${all.length}건</span></h1>${search}</div>${chips}<div id="recList" class="rc-grid"></div>`
    : `<h1>진료 기록</h1>${search}${chips}<div id="recList"></div>`;
  if (S.delMode) $app.insertAdjacentHTML('beforeend', '<div class="delbar" id="delBar"></div>');
  const sel = document.querySelector('#deptChips .chip.sel');
  if (sel && sel.scrollIntoView) sel.scrollIntoView({inline: 'center', block: 'nearest'});   // 고른 칩이 화면 안에 보이게
  drawRecordList();
}
/** 지금 보이는(진료과·검색으로 걸러진) 기록 목록 */
function shownRecords(){
  const q = S.query.trim();
  return S.recordsCache.filter(r => (S.filter === '전체' || (r.dept || '미분류') === S.filter) && (!q || (r.dept+r.hospital+r.brief).includes(q)));
}
function drawRecordList(){
  const list = shownRecords();
  const sel = S.delSel || {}, pk = id => S.delMode && sel[id] ? 'picked' : '';
  const box = id => S.delMode ? `<span class="selbx">${sel[id] ? '✓' : ''}</span>` : '';
  const click = id => S.delMode ? `toggleDelSel('${id}')` : `go('detail','${id}')`;
  const newest = S.recordsCache[0] && S.recordsCache[0].id;
  const empty = `<div class="sub" style="text-align:center;margin-top:2rem;grid-column:1/-1">${S.recordsCache.length && S.filter !== '전체'
      ? esc(S.filter) + ' 기록이 아직 없어요.' : '아직 기록이 없어요.<br>홈에서 "진료 녹음 시작"을 눌러 보세요.'}</div>`;
  const desk = isDesk();
  document.getElementById('recList').innerHTML = list.length ? list.map(r => {
    const d = parse(r.date);
    const dept = r.dept ? esc(r.dept) : '<span style="color:var(--amber-dk)">진료과를 골라 주세요</span>';
    if (desk) return `<button class="rcard ${r.id===newest?'new':''} ${pk(r.id)}" onclick="${click(r.id)}">${box(r.id)}
      ${r.id===newest ? '<span class="badge">새 기록</span>' : ''}
      <div class="rc-date"><b>${d.getDate()}</b><span>${d.getFullYear()}년<br>${d.getMonth()+1}월</span></div>
      <div class="rc-body"><div class="rc-dept">${dept}</div>${r.hospital ? `<div class="rc-hosp">${esc(r.hospital)}</div>` : ''}<p>${esc(r.brief)}</p></div></button>`;
    return `<button class="rec ${r.id===newest?'new':''} ${pk(r.id)}" onclick="${click(r.id)}">${box(r.id)}
      <div class="d"><b>${d.getDate()}</b><span>${d.getMonth()+1}월</span></div>
      <div class="tx"><b>${dept} ${r.id===newest?'<span class="badge">새 기록</span>':''}</b><p>${esc(r.brief)}</p></div>
      ${S.delMode ? '' : '<span style="font-size:1.3rem;color:var(--sub)">›</span>'}</button>`;
  }).join('') : empty;
  drawDelBar();
}

/* ----- 진료 기록 지우기: 휴지통 → 고르기(하나 또는 여러 개) → 삭제 → 한 번 더 확인 ----- */
function toggleDeleteMode(){ S.delMode = !S.delMode; S.delSel = {}; drawRecords(); }
function toggleDelSel(id){
  S.delSel = S.delSel || {};
  if (S.delSel[id]) delete S.delSel[id]; else S.delSel[id] = true;
  drawRecordList();
}
/** 보이는 기록을 모두 고르기(이미 다 골랐으면 모두 풀기) */
function selAllDel(){
  const ids = shownRecords().map(r => r.id), all = ids.length && ids.every(id => S.delSel[id]);
  S.delSel = {}; if (!all) ids.forEach(id => S.delSel[id] = true);
  drawRecordList();
}
function drawDelBar(){
  const el = document.getElementById('delBar'); if (!el) return;
  const n = Object.keys(S.delSel || {}).length;
  el.innerHTML = `<b>${n ? n + '개 골랐어요' : '기록을 골라 주세요'}</b>
    <button class="btn" onclick="toggleDeleteMode()">취소</button>
    <button class="btn danger-fill" ${n ? '' : 'disabled'} onclick="askDelete()">삭제</button>`;
}
function askDelete(){
  const n = Object.keys(S.delSel || {}).length;
  if (!n){ toast('지울 기록을 먼저 골라 주세요'); return; }
  openSheet(`<div style="text-align:center"><div class="del-ico">${ICON.trash}</div>
      <b class="sh-t" style="font-size:1.25rem;margin:.6rem 0 .2rem">정말로 지우겠습니까?</b>
      <div style="color:var(--red-dk);font-weight:700">체크리스트도 함께 삭제됩니다.</div>
      <div class="small" style="margin:.35rem 0 1rem">고른 기록 ${n}개 · 지우면 되돌릴 수 없어요</div></div>
    <button class="btn danger-fill" onclick="doDelete()">네, 삭제합니다</button>
    <button class="btn" style="margin-top:.5rem" onclick="closeSheet()">아니오</button>`);
}
async function doDelete(){
  const ids = Object.keys(S.delSel || {});
  closeSheet();
  const r = await call('지우는 중이에요', 'deleteRecords', ids);
  toast('기록 ' + r.records + '개' + (r.tasks ? '와 체크리스트 ' + r.tasks + '개' : '') + '를 지웠어요');
  if (S.detail && ids.includes(S.detail.id)){ S.detail = null; S.pdf = null; }
  try { localStorage.removeItem('aihh_home'); } catch(e){}   // 홈의 '오늘 할 일' 숫자도 새로 받게
  viewRecords();
}

/* ================= 2-2 기록 상세 ================= */
async function viewDetail(id){
  const r = await call('불러오는 중이에요', 'getRecord', id);
  S.detail = r;
  if (S.pdf && S.pdf.id !== id) S.pdf = null;

      <div id="audioBox"><button class="btn" style="margin-top:.4rem" onclick="loadAudio('${r.id}')">▶ 녹음 듣기</button></div></div>` : '';
  const tasks = (s['할일']||[]).length ? `<div class="card"><b class="t">건강관리에 추가된 할 일</b>${s['할일'].map(t => `<div>· [${esc(t['시간대'])}] ${esc(t['할일'])}</div>`).join('')}</div>` : '';

    ${pageTop(korDate(r.date) + ' ' + esc(r.dept || '진료'))}
    <div id="deptBox">${deptPickRow(r)}</div>
    ${player}
    <div class="grid3" style="margin-bottom:.7rem">

    ${briefHTML(s)}
    <div class="card"><b class="t">무슨 병인가요?</b>${esc(s['무슨병'] || '-')}</div>
    <div class="card"><b class="t">약은 어떻게 먹나요?</b>${esc(s['약'] || '-')}</div>
    ${extraCards(r)}
    <div class="card"><b class="t">다음 진료</b>${r.next ? korDate(r.next, true)+' '+korTime(r.next.slice(11)) : '-'}</div>
    ${terms.length ? `<div class="card"><b class="t">어려운 말 풀이</b>${terms.map(t => `<div><b>${esc(t['용어'])}</b>: ${esc(t['설명'])}</div>`).join('')}</div>` : ''}
    ${tasks}
    <div class="note">AI 요약은 참고용이에요. 궁금한 점은 의료진·약사에게 확인하세요</div>
    ${original}`;
    drawPdfLink();
    return;
  }

  /* 컴퓨터: 왼쪽 요약 카드 2열 | 오른쪽 진료 정보·녹음·버튼(따라 내려옴) */
  $app.innerHTML = `
    ${pageTop(korDate(r.date, true) + ' ' + esc(r.dept || '진료') + ' 기록')}
    <div class="rs">
      <div>
        <div class="rs-cards">
          ${briefHTML(s)}
          <div class="card span2 big"><b class="t">무슨 병인가요?</b>${esc(s['무슨병'] || '-')}</div>
          <div class="card"><b class="t">약은 어떻게 먹나요?</b>${esc(s['약'] || '-')}</div>
          ${extraCards(r)}
          <div class="card"><b class="t">다음 진료</b>${r.next ? korDate(r.next, true)+' '+korTime(r.next.slice(11)) : '-'}</div>
          ${tasks}
        </div>
        ${terms.length ? `<h2>어려운 말 풀이</h2><div class="terms">${terms.map(t => `<div class="card"><b>${esc(t['용어'])}</b><div>${esc(t['설명'])}</div></div>`).join('')}</div>` : ''}
        <div class="note">AI 요약은 참고용이에요. 궁금한 점은 의료진·약사에게 확인하세요</div>
        ${original}
      </div>
      <aside class="rs-side">
        <div class="card"><b>진료 정보</b>
          <div class="meta"><b>날짜</b><span>${korDate(r.date, true)} ${korTime(r.date.slice(11))}</span>
            ${r.hospital ? `<b>병원</b><span>${esc(r.hospital)}</span>` : ''}<b>진료과</b><span>${esc(r.dept || '아직 안 골랐어요')}</span></div>
          <div id="deptBox" style="margin-top:.6rem">${r.dept ? `<button class="btn" style="min-height:44px;font-size:.8rem;font-weight:400" onclick="changeDept()">진료과 바꾸기</button>`
            : `<div class="small" style="margin-bottom:.4rem">어느 진료과였나요? 누르면 바로 저장돼요</div>${deptButtons(r, 'pickDept')}`}</div>

        ${player}
        <div class="act">
